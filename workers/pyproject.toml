[project]
name = "tela-worker"
version = "0.1.0"
description = "Tela background worker (COMP-008/009): Celery tasks and outbox relay"
requires-python = ">=3.12"
dependencies = [
    "tela-common[otel]",
    "celery[redis]>=5.4",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "httpx>=0.28",
    "playwright>=1.55",
    "openpyxl>=3.1",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tela_worker"]

# Trivy secret-scan settings for the CI image scan (ci.yml, "Vulnerability scan").
# The Anthropic SDK's docstrings show the literal `{"type": "service_account"}`,
# which Trivy's gcp-service-account rule reads as a Google key. Only that
# package's folder is allowed; secrets anywhere else still fail the scan.
allow-rules:
  - id: anthropic-sdk-docstrings
    description: Anthropic SDK docstrings, not credentials
    path: .*/site-packages/anthropic/.*

        dir: desc
      export_name: Open risks
    footnote: Open = not Closed (risks, issues) or not Completed (actions, decisions); a blank state counts as open. High exposure = likelihood × consequence 15 or more (draft). Cost exposure is what a risk could cost, not money spent.
  - id: resource_utilisation

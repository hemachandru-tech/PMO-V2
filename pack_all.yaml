      sort:
        field: tpg_totalforecast
        dir: desc
      export_name: CAPEX budget vs forecast
    callout:
      title: Forecasts are estimates
      text: Forecast cost (Total Forecast) is what each project is expected to cost at completion. There are no figures of money actually paid out.
      level: info
    footnote: Budget type CAPEX. Forecast cost is the project’s Total Forecast, the estimated cost at completion, not money spent; forecast minus budget is a forecast comparison. Totals cover projects with a budget above 0 and a forecast.

    triggers: [capex, budget vs forecast, forecast vs budget, budget and forecast, forecast cost, eac, finance, financial, budget, spend, cost]
    filters:
      - ref: budget_type
        op: '='
        values: [CAPEX]
    kpis: [approved_budget_total, forecast_cost_total, net_forecast_variance, over_budget, forecast_over_budget_15]
    widgets:
      - title: Approved budget and forecast cost by portfolio
        measure: approved_budget_total
        extra_measures: [forecast_cost_total]
        breakdowns: [portfolio]
        visual: paired_bars
      - title: Forecast vs budget spread
        measure: total_projects
        breakdowns: [variance_spread]
        visual: columns
      - title: Forecast cost by component
        measure: cost_internal_total
        extra_measures: [cost_external_total, cost_contingency_total]
        visual: table
      - title: Hardware and software forecast cost
        measure: cost_hw_total
        extra_measures: [cost_sw_total]
        visual: table

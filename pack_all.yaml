    kpis: [open_projects, trouble_projects, overdue_go_lives, reported_red_pct]
    footnote: Trouble = reported Red, or overdue (Active, planned go-live before the reporting date, no actual go-live). Shares are whole-number percentages of all open projects and of all projects in trouble.
  - id: cio_reliability
    title: How much of this can I rely on?
    tab: Can I rely on it?
    dashboard: audience_cio
    question: How much of what my book shows is backed by evidence and filled-in data?
    population: Open projects (current state Project Created, Active or On Hold).
    triggers: [how much can i rely on, evidence coverage, can i trust this, data trust]
    kpis: [status_not_set, no_first_baseline, no_report_60d, missing_stage_date, no_delivery_manager]
    footnote: Read from the fields the figures depend on; the nine evidence checks need a calculator this pack does not have. A gap (no reported status, no first baseline, no report in 60 days, a missing stage date, no delivery manager) means the figure that depends on it cannot be fully relied on.

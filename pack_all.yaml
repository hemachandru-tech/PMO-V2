    kpis: [open_projects, reported_green, slipped_projects, overdue_go_lives, no_first_baseline]
    footnote: Open projects (current state Project Created, Active or On Hold). Reported status is the project's own colour; Yellow is shown as Amber. Slip = finish date − first-baselined go-live; the finish date is the actual go-live if live, otherwise the planned go-live, and the reporting date once the planned go-live has passed with no actual go-live.
  - id: cio_the_promise
    title: The promise
    tab: The promise
    dashboard: audience_cio
    question: Which open projects are later than the go-live they first committed to, and by how much?
    population: Open projects (current state Project Created, Active or On Hold). Slip only where a first-baselined go-live exists.
    triggers: [the promise, first baseline, slip against baseline, slipped projects, broken promises]
    kpis: [slipped_projects, slip_days_total, no_first_baseline, no_first_baseline_with_ib_pcr]
    footnote: Slip = finish date − first-baselined go-live; the finish date is the actual go-live if live, otherwise the planned go-live, and the reporting date once the planned go-live has passed with no actual go-live. A project without a first-baselined go-live has no slip value and is counted apart.
  - id: cio_promise_moved
    title: How the promise moved, and who moved it
    tab: Who moved the promise
    dashboard: audience_cio
    question: How much of the slip was agreed through change requests, by whom, and how much just happened?
    population: Slipped open projects.
    triggers: [how the promise moved, who moved the promise, agreed vs silent, silent slip, agreed slip]
    kpis: [slip_days_total, slipped_with_pcr, slipped_no_pcr]
    footnote: Slipped with a PCR = at least one PCR whose change type is not Initial Baseline, any approval status. Splitting slip days into agreed and silent needs a calculator this pack does not have.
  - id: cio_green_really_green
    title: Is Green really green?
    tab: Is Green really green?
    dashboard: audience_cio
    question: Which projects report Green while their own records say otherwise?
    population: Open projects reported Green.
    triggers: [is green really green, false greens, watermelon projects, greens to challenge, hard warnings]
    kpis: [reported_green, green_hard_warning, overdue_go_lives, named_blocker_projects, overdue_action_projects]
    footnote: Hard warning = overdue; a blocker named on a status report in the last 30 days; an overdue action; a late unfinished task flagged critical. Slipped with no PCR is shown on its own. The colour is never changed, only challenged.
  - id: cio_pressure

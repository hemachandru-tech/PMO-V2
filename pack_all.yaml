  - id: pmo_lifecycle
    title: Where projects sit in the lifecycle
    tab: Lifecycle
    dashboard: audience_pmo
    question: In which stage, by plan, are the open projects, and what colour do they report there?
    population: Open projects (current state Project Created, Active or On Hold).
    triggers: [where projects sit in the lifecycle, stage, stages, portfolio storyboard, stage by status]
    kpis: [open_projects, staged_open_projects, missing_stage_date]
    footnote: Read by the project's lifecycle phase. Stage from planned S2–S7 dates needs a calculator this pack does not have.
  - id: pmo_review_pack
    title: The weekly list, ready for the review pack
    tab: Review pack
    dashboard: audience_pmo
    question: Which ten projects go into this week's review pack?
    population: Open projects (current state Project Created, Active or On Hold).
    triggers: [weekly list, review pack, top 10 projects, weekly review]
    kpis: [trouble_projects]
    footnote: Trouble = reported Red, or overdue (Active, planned go-live before the reporting date, no actual go-live). The severity score needs a calculator this pack does not have, so the list ranks projects in trouble.
  - id: dm_my_book
    title: My book today
    tab: My book
    dashboard: audience_delivery_manager
    question: Where does each of my open projects stand today?
    population: Open projects of the selected delivery manager.
    triggers: [my book today, my projects, my book, my portfolio]
    kpis: [open_projects, overdue_go_lives, slipped_projects, trouble_projects]
    footnote: Filtered to one delivery manager. Dates are counted from the reporting date.
  - id: dm_coming_up
    title: Coming up
    tab: Coming up
    dashboard: audience_delivery_manager
    question: Which of my projects go live in the next 30, 60 and 90 days?
    population: Open projects with no actual go-live.
    triggers: [coming up, next go-lives, upcoming go-lives, due soon]
    kpis: [go_lives_0_30, go_lives_31_60, go_lives_61_90, go_lives_next_90]
    footnote: 'Planned go-lives only, never stage end dates. Windows: next 30 days, 31–60, 61–90.'
  - id: dm_whats_stuck
    title: What's stuck
    tab: What's stuck
    dashboard: audience_delivery_manager
    question: Which of my projects are blocked, behind on actions or late on a critical task?
    population: Open projects (current state Project Created, Active or On Hold).
    triggers: [what's stuck, stuck projects, blocked projects, blockers]
    kpis: [named_blocker_projects, overdue_action_projects, late_critical_task_projects]
    footnote: Stuck = a named blocker on the latest status report, an overdue action, or a late task flagged critical.
  - id: dm_owe_pmo
    title: What I owe the PMO
    tab: What I owe
    dashboard: audience_delivery_manager
    question: What do I still owe the PMO on my projects?
    population: Open projects of the selected delivery manager.
    triggers: [what i owe the pmo, my to do, missing updates, owe the pmo]
    kpis: [no_report_60d, no_first_baseline, open_actions_no_due_date]
    footnote: Owed = no status report in 60 days (or none); no first-baselined go-live; an action with no owner or no due date.
  - id: dm_team
    title: My team and my work
    tab: My team
    dashboard: audience_delivery_manager
    question: Who is on my projects, and what work is logged?
    population: Timesheet lines of my open projects.
    triggers: [my team and my work, my team, team members, who works on my projects]
    kpis: [hours_logged, hours_approved, hours_awaiting_approval, people_logging]
    footnote: Timesheet lines and task assignments mostly point into other projects (2 of 322 lines land on their own project), so hours are read per line, not as effort against the plan.
  - id: dm_changed
    title: What changed since last week
    tab: What changed
    dashboard: audience_delivery_manager
    question: Which change requests and status reports arrived on my projects this week?
    population: PCRs and status reports of open projects in the 7 days to the reporting date.
    triggers: [what changed since last week, what changed, this week, recent changes]
    kpis: [pcrs_last_7d, status_reports_7d]
    footnote: Requested date (PCRs) and report date (status reports) from 7 days before the reporting date up to it. There is no history of field changes, so edits to a project itself are not listed.
  - id: req_pipeline
    title: The pipeline
    tab: The pipeline
    dashboard: audience_request
    question: Where do requests stand, from New to Approved?
    population: All requests.
    triggers: [the pipeline, request pipeline, requests by state, intake pipeline]
    kpis: [total_requests, open_demand, approved_for_delivery, rejected_or_dropped]
    footnote: Open requests = New, Active, On Hold and Return to Requester. The request stage field is empty in the extract, so requests are read by state.
  - id: req_speed
    title: Speed to approval
    tab: Speed to approval
    dashboard: audience_request
    question: How long does a request take to be approved, become a project and be committed?
    population: Requests that a project names.
    triggers: [speed to approval, request lead time, time to approve, darb lead time]
    kpis: [request_to_darb_median, darb_to_project_median, project_to_baseline_median, converted_requests]
    footnote: 'Averages, as a median cannot be computed on Dataverse yet. Request → DARB approval: client request date → DARB approval date. DARB → project: → the project’s created date. Project → commitment: → the first-baselined go-live. Only the 24 projects that name their request are measured.'
    widgets:
      - title: Average days per leg
        measure: request_to_darb_median
        extra_measures: [darb_to_project_median, project_to_baseline_median]
        visual: columns
  - id: req_conversion
    title: Does an approved request become a project?
    tab: Approved to project
    dashboard: audience_request
    question: Do approved requests turn into projects?
    population: Requests in state Approved.
    triggers: [does an approved request become a project, approved but no project, approved requests, request to project]
    kpis: [approved_for_delivery, approved_named_by_project, approved_no_project]
    footnote: Named by a project = some project's request lookup points to the request; each request counts once. The request's Project Link may connect some of the rest.
  - id: req_shaping_cost
    title: The cost of shaping requests
    tab: Shaping cost
    dashboard: audience_request
    question: How many hours go into requests before they become projects?
    population: Request timesheet lines.
    triggers: [cost of shaping requests, hours on requests, request effort logged, shaping cost]
    kpis: [request_hours, requests_with_hours]
    footnote: Hours = total hours on request timesheet lines. Assumes every team that shapes requests logs its time there.
  - id: req_stuck
    title: Stuck and sent back
    tab: Stuck and sent back
    dashboard: audience_request
    question: Which open requests are oldest, on hold or sent back?
    population: Open requests.
    triggers: [stuck and sent back, returned requests, old requests, oldest requests]
    kpis: [open_demand, oldest_open_request_days, requests_on_hold_over_180]
    footnote: Age = days from the request's created date to the reporting date.
  - id: req_intake_list
    title: The intake meeting list
    tab: Intake list
    dashboard: audience_request
    question: Which open requests go to the next intake meeting?
    population: Open requests.
    triggers: [intake meeting list, intake list, intake meeting]
    kpis: [open_demand, overdue_gates_total]
    footnote: Oldest first. Request priority is filled on few requests ("Not Analysed" on 20).
  - id: data_link_health
    title: Link health
    tab: Link health
    dashboard: audience_data_owner
    question: Do the records point to each other the way the model expects?
    population: All projects and requests, with their tasks, timesheets and change requests.
    triggers: [link health, broken links, links between tables, timesheet links]
    kpis: [total_projects, projects_with_tasks, projects_with_time, projects_with_pcr, approved_no_project]
    footnote: A link counts when the child record names the project or request. Timesheet lines mostly point into other projects (2 of 322 lines land on their own project), so hours are read per line. Approved requests with no project may still be connected through the request’s Project Link.
  - id: data_evidence_coverage
    title: Evidence coverage
    tab: Evidence coverage
    dashboard: audience_data_owner
    question: How many open projects carry the records the evidence checks rely on?
    population: Open projects (current state Project Created, Active or On Hold).
    triggers: [evidence coverage, evidence checks, nine checks]
    kpis: [open_projects, staged_open_projects, no_first_baseline, status_not_set, no_report_60d]
    footnote: 'The nine evidence checks need a calculator this pack does not have, so coverage is read from the fields they rely on: a stage schedule, a first-baselined go-live, a reported status and a status report in the last 60 days.'
  - id: data_model_usage
    title: What the model is built for, and what is used
    tab: Model usage
    dashboard: audience_data_owner
    question: Which tables of the model hold records, and which are empty?
    population: Every record in each Dataverse table of the pack.
    triggers: [what the model is built for, table usage, unused tables, model usage]
    kpis: [tpg_project_count, tpg_projectrequests_count, tpg_projecttask_count, tpg_timesheet_count, tpg_statusreport_count]
    footnote: Counts every record in the table, in any state. A table with 0 records is built into the model but not used.
  - id: data_trend
    title: Is it getting better?
    tab: Getting better?
    dashboard: audience_data_owner
    question: Are projects keeping their records more up to date?
    population: Open projects and their status reports and change requests.
    triggers: [is it getting better, data quality trend]
    kpis: [status_reports_30d, status_reports_7d, no_report_60d, stale_projects, pcrs_last_7d]
    footnote: Each figure is read at the reporting date. A trend appears only by comparing reporting dates; the extract holds no history of field changes.
  - id: data_trust
    title: What each dashboard can be trusted for today
    tab: What to trust
    dashboard: audience_data_owner
    question: Which figures on each dashboard can be trusted today?
    population: Open projects (current state Project Created, Active or On Hold) and all projects for budget codes.
    triggers: [what can be trusted, dashboard trust]
    kpis: [status_not_set, no_first_baseline, no_delivery_manager, missing_stage_date, budget_code_compliance_pct]
    footnote: 'Each gap weakens the figures that read the field: reported status for the colour views, first baseline for slip, delivery manager for the filters, stage dates for the lifecycle, budget code for finance.'
  - id: critical_path
    title: Critical path
    tab: Critical path
    dashboard: critical_path
    question: Do the task dependencies form a critical path on the projects that have a plan?
    population: Tasks of project plans (summary rows left out).
    triggers: [critical path network, task dependency network, dependency chain]
    kpis: [projects_with_tasks, plan_tasks, critical_open_tasks, critical_tasks_late]
    footnote: No project has a dependency between two of its own tasks, so no network can be drawn; is critical is read as the PM sets it. Open = progress below 100 %; late = finish date before the reporting date.

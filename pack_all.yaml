# reports: report blueprints (report_blueprints.yaml), matched by id
reports:
  - id: projects_overview
    tab: Overview
    title: Projects overview
    dashboard: projects_overview
    section: Overview
    question: How is the open portfolio doing, and what needs attention first?
    population: Open projects (Project Created, Active, On Hold).
    triggers: [projects overview, portfolio overview, portfolio summary, overview]
    kpis: [in_delivery, overdue_go_lives, net_forecast_variance, key_priorities_attention]
    widgets:
      - title: Budget position by portfolio
        measure: approved_budget_total
        extra_measures: [forecast_cost_total]
        breakdowns: [portfolio]
        visual: paired_bars
      - title: Reported status by region
        measure: open_projects
        breakdowns: [region, reported_status]
        visual: stacked_status
    table:
      title: Open projects
      measure: open_projects
      columns: [tpgmea_pprojectnumber, tpg_subject, tpgmea_customcio, tpg_portfolio, tpg_projectstatusname, tpg_lifecyclephase, tpgmea_productdeploydate, tpgmea_pdeliverymanager]
      sort:
        field: tpgmea_productdeploydate
        dir: asc
      export_name: Open projects
    footnote: Open projects = Project Created, Active and On Hold. Forecast cost is the project’s Total Forecast, the estimated cost at completion, not money spent; budget totals cover projects with a comparable budget and forecast.
  - id: cio_portfolio
    tab: CIO & Portfolio
    title: CIO and portfolio view
    dashboard: cio_portfolio
    section: Executive
    question: Where do the open projects sit by CIO and portfolio, and what status do their managers give them?
    population: Open projects.
    triggers: [cio and portfolio, cio portfolio, portfolio view, by cio and portfolio]
    kpis: [open_projects, in_delivery, on_hold, status_not_set]
    widgets:
      - title: Reported status by portfolio
        measure: open_projects
        breakdowns: [portfolio, reported_status]
        visual: stacked_status
      - title: Open projects by CIO
        measure: open_projects
        breakdowns: [cio]
        visual: ranked_bar
    table:
      title: Open projects
      measure: open_projects
      columns: [tpgmea_pprojectnumber, tpg_subject, tpgmea_customcio, tpg_portfolio, tpg_overallkpiname, tpg_projectstatusname, tpg_lifecyclephase, tpgmea_productdeploydate, tpgmea_pdeliverymanager]
      sort:
        field: tpg_portfolio
        dir: asc
      export_name: Open projects by CIO and portfolio
    footnote: Open projects = Project Created, Active and On Hold. Reported status is the project manager's own; Not set is counted apart and never as Green.
  - id: portfolio_status
    tab: Portfolio status
    title: Portfolio status (calculated health)
    dashboard: portfolio_status
    section: Executive
    question: What does Tela's calculated health say about the open projects, next to what managers report?
    population: Open projects; calculated health from schedule, cost, progress and the issue KPI.
    triggers: [portfolio status, calculated health, health score, health scores]
    kpis: [avg_health_score, health_green, health_amber, health_red, health_insufficient]
    widgets:
      - title: Calculated health
        measure: open_projects
        breakdowns: [calculated_health]
        visual: donut
      - title: Reported status
        measure: open_projects
        breakdowns: [reported_status]
        visual: donut
      - title: Schedule KPI by portfolio
        measure: open_projects
        breakdowns: [portfolio, schedule_status]
        visual: stacked_status
    table:
      title: Open projects and their status
      measure: open_projects

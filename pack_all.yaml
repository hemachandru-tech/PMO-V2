  - key: total_projects
    label: Projects
    entity: tpg_project
    plain_rule: Every project record.
    expression: {agg: count}
  - key: open_projects
    label: Open projects
    entity: tpg_project
    plain_rule: Projects whose current state is Project Created, Active or On Hold. Completed and Dropped are closed. The Dataverse statecode is not used for this.
    expression: {agg: count, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}}
  - key: inactive_projects
    label: Closed projects
    entity: tpg_project
    plain_rule: Projects whose current state is anything other than Project Created, Active or On Hold (Completed, Dropped).
    expression: {agg: count, where: {field: tpg_projectstatusname, op: not_in, values: [Project Created, Active, On Hold]}}
  - key: in_delivery
    label: Projects in delivery
    entity: tpg_project
    plain_rule: Projects whose current state is Active. Project Created and On Hold are open but not in delivery.
    expression: {agg: count, where: {field: tpg_projectstatusname, op: '=', value: Active}}
  - key: on_hold
    label: Projects on hold
    entity: tpg_project
    plain_rule: Open projects whose current state is On Hold.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_projectstatusname, op: '=', value: On Hold}]}}
  - key: project_created
    label: Projects not yet started
    entity: tpg_project
    plain_rule: Open projects whose current state is Project Created.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_projectstatusname, op: '=', value: Project Created}]}}
  - key: overdue_go_lives
    label: Overdue go-lives
    entity: tpg_project
    plain_rule: Projects in delivery whose planned deployment date is before the reporting date and that are not yet deployed. A planned date equal to the reporting date is not overdue.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_productdeploydate, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_projectimpdate, op: is_null}]}}
  - key: schedule_risk
    label: Schedule risk
    entity: tpg_project
    plain_rule: Open projects whose schedule KPI is Red or Amber (Yellow). A PM signal, distinct from overdue.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_schedulekpiname, op: in, values: [Red, Yellow, Amber]}]}}
  - key: rag_contradictions
    label: RAG contradictions
    entity: tpg_project
    plain_rule: Open, undeployed projects reported Green at least 15 days after their planned date, or reported Red at least 30 days before it.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_projectimpdate, op: is_null}, {any: [{all: [{field: tpg_schedulekpiname, op: '=', value: Green}, {field: tpgmea_productdeploydate, op: <=, value: {asof_offset_days: -15}}]}, {all: [{field: tpg_schedulekpiname, op: '=', value: Red}, {field: tpgmea_productdeploydate, op: '>=', value: {asof_offset_days: 30}}]}]}]}}
  - key: stale_projects
    label: Stale projects
    entity: tpg_project
    plain_rule: Projects in delivery not modified for more than 30 days. Any edit resets this, so it is not a status-report compliance measure.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: modifiedon, op: <, value: {asof_offset_days: -30}}]}}
  - key: go_lives_0_30
    label: Go-lives in the next 30 days
    entity: tpg_project
    plain_rule: Open, undeployed projects planned from the reporting date up to 30 days after it (by planned deployment date).
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_projectimpdate, op: is_null}, {field: tpgmea_productdeploydate, op: '>=', value: {asof_offset_days: 0}}, {field: tpgmea_productdeploydate, op: <=, value: {asof_offset_days: 30}}]}}
  - key: go_lives_31_60
    label: Go-lives in 31–60 days
    entity: tpg_project
    plain_rule: Open, undeployed projects planned more than 30 and up to 60 days after the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_projectimpdate, op: is_null}, {field: tpgmea_productdeploydate, op: '>', value: {asof_offset_days: 30}}, {field: tpgmea_productdeploydate, op: <=, value: {asof_offset_days: 60}}]}}
  - key: go_lives_61_90
    label: Go-lives in 61–90 days
    entity: tpg_project
    plain_rule: Open, undeployed projects planned more than 60 and up to 90 days after the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_projectimpdate, op: is_null}, {field: tpgmea_productdeploydate, op: '>', value: {asof_offset_days: 60}}, {field: tpgmea_productdeploydate, op: <=, value: {asof_offset_days: 90}}]}}
  - key: over_budget
    label: Over-budget projects
    entity: tpg_project
    plain_rule: Projects whose Total Forecast is above an approved budget above 0. Forecast cost is the project’s Total Forecast (tpg_totalforecast); EAC (Cost - Total) is not in this pack.
    expression: {agg: count, where: {all: [{field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>', other_field: tpgmea_approvedbudgetvaluesusd}]}}
  - key: approved_budget_total
    label: Approved budget (USD)
    entity: tpg_project
    plain_rule: Sum of approved budget over open projects with a budget above 0 and a Total Forecast of 0 or more.
    expression: {agg: sum, field: tpgmea_approvedbudgetvaluesusd, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}
  - key: forecast_cost_total
    label: Forecast cost (USD)
    entity: tpg_project
    plain_rule: Sum of Total Forecast over open projects with a budget above 0 and a forecast of 0 or more. Forecast cost is the project’s Total Forecast (tpg_totalforecast); EAC (Cost - Total) is not in this pack.
    expression: {agg: sum, field: tpg_totalforecast, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}
  - key: budget_variance
    label: Forecast variance (USD)
    entity: tpg_project
    plain_rule: Total Forecast minus approved budget over the same open projects. Negative means under budget.
    expression: {op: sub, left: {agg: sum, field: tpg_totalforecast, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}, right: {agg: sum, field: tpgmea_approvedbudgetvaluesusd, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}}
  - key: budget_variance_pct
    label: Forecast variance (%)
    entity: tpg_project
    plain_rule: Forecast variance divided by approved budget, as a percentage (blank when the approved total is 0).
    expression: {op: div, left: {op: sub, left: {agg: sum, field: tpg_totalforecast, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}, right: {agg: sum, field: tpgmea_approvedbudgetvaluesusd, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}}, right: {agg: sum, field: tpgmea_approvedbudgetvaluesusd, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}, scale: 100}
  - key: projects_excluded
    label: Projects excluded from finance totals
    entity: tpg_project
    plain_rule: Open projects without a budget above 0 and a Total Forecast of 0 or more.
    expression: {op: sub, left: {agg: count, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}}, right: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: '>=', value: 0}]}}}
  - key: open_demand
    label: Open demand requests
    entity: tpg_projectrequests
    plain_rule: Requests in state New, Active, On Hold or Return to Requester.
    expression: {agg: count, where: {field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}}
  - key: overdue_dou
    label: Overdue DOU gates
    entity: tpg_projectrequests
    plain_rule: Open requests that need a DOU, whose planned DOU date is before the reporting date, with no DOU issued.
    expression: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_dourequiredname, op: '=', value: 'Yes'}, {field: tpgmea_planneddouissuancedate, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_dousubmissiondate, op: is_null}]}}
  - key: overdue_darb
    label: Overdue DARB gates
    entity: tpg_projectrequests
    plain_rule: Open, non-exempt requests whose DARB review date is before the reporting date and that are not yet approved.
    expression: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_darbexempted, op: '=', value: false}, {field: tpgmea_darbreviewdate, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_darbapprovaltimestamp, op: is_null}]}}
  - key: overdue_sow
    label: Overdue SOW gates
    entity: tpg_projectrequests
    plain_rule: Open requests whose planned SOW date is before the reporting date with no SOW issued.
    expression: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_tentativedateofsowissuance, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_sowissueddate, op: is_null}]}}
  - key: total_requests
    label: Requests
    entity: tpg_projectrequests
    plain_rule: Every demand request.
    expression: {agg: count}
  - key: reported_green_pct
    label: Reported Green (%)
    entity: tpg_project
    plain_rule: Open projects reported Green, as a share of open projects with a reported status. Not set is left out of the denominator.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: '=', value: Green}]}}, right: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: in, values: [Green, Yellow, Amber, Red]}]}}, scale: 100}
  - key: reported_amber_pct
    label: Reported Amber (%)
    entity: tpg_project
    plain_rule: Open projects reported Amber (Yellow), as a share of open projects with a reported status.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: in, values: [Yellow, Amber]}]}}, right: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: in, values: [Green, Yellow, Amber, Red]}]}}, scale: 100}
  - key: reported_red_pct
    label: Reported Red (%)
    entity: tpg_project
    plain_rule: Open projects reported Red, as a share of open projects with a reported status.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: '=', value: Red}]}}, right: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: in, values: [Green, Yellow, Amber, Red]}]}}, scale: 100}
  - key: status_not_set
    label: Reported status not set
    entity: tpg_project
    plain_rule: Open projects with no reported status. Shown as Not set, never as Green.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpg_overallkpiname, op: is_null}, {field: tpg_overallkpiname, op: not_in, values: [Green, Yellow, Amber, Red]}]}]}}
  - key: avg_health_score
    label: Calculated Green (%)
    entity: tpg_project
    plain_rule: Calculated Green as a share of open projects whose schedule, cost and issues KPIs are all set. Replaces the 0–100 score, which needs a calculator this pack does not have.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_schedulekpiname, op: '=', value: Green}, {field: tpg_costkpiname, op: '=', value: Green}, {field: tpg_issuekpiname, op: '=', value: Green}]}}, right: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_schedulekpiname, op: not_null}, {field: tpg_costkpiname, op: not_null}, {field: tpg_issuekpiname, op: not_null}]}}, scale: 100}
  - key: health_green
    label: Calculated Green
    entity: tpg_project
    plain_rule: Open projects whose schedule, cost and issues KPIs are all Green.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_schedulekpiname, op: '=', value: Green}, {field: tpg_costkpiname, op: '=', value: Green}, {field: tpg_issuekpiname, op: '=', value: Green}]}}
  - key: health_amber
    label: Calculated Amber
    entity: tpg_project
    plain_rule: Open projects with all three KPIs set, none Red and at least one Amber (Yellow).
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_schedulekpiname, op: not_null}, {field: tpg_costkpiname, op: not_null}, {field: tpg_issuekpiname, op: not_null}, {field: tpg_schedulekpiname, op: '!=', value: Red}, {field: tpg_costkpiname, op: '!=', value: Red}, {field: tpg_issuekpiname, op: '!=', value: Red}, {any: [{field: tpg_schedulekpiname, op: '=', value: Yellow}, {field: tpg_costkpiname, op: '=', value: Yellow}, {field: tpg_issuekpiname, op: '=', value: Yellow}]}]}}
  - key: health_red
    label: Calculated Red
    entity: tpg_project
    plain_rule: Open projects whose schedule, cost or issues KPI is Red.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpg_schedulekpiname, op: '=', value: Red}, {field: tpg_costkpiname, op: '=', value: Red}, {field: tpg_issuekpiname, op: '=', value: Red}]}]}}
  - key: health_insufficient
    label: Insufficient data
    entity: tpg_project
    plain_rule: Open projects with a blank schedule, cost or issues KPI and none Red. Never counted as Green.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpg_schedulekpiname, op: is_null}, {field: tpg_costkpiname, op: is_null}, {field: tpg_issuekpiname, op: is_null}]}, {field: tpg_schedulekpiname, op: '!=', value: Red}, {field: tpg_costkpiname, op: '!=', value: Red}, {field: tpg_issuekpiname, op: '!=', value: Red}]}}
  - key: key_priorities_attention
    label: Key priorities needing attention
    entity: tpg_project
    plain_rule: Open key priority projects whose schedule, cost or issues KPI is Red or Amber (Yellow).
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_keypriorityproject, op: '=', value: true}, {any: [{field: tpg_schedulekpiname, op: in, values: [Red, Yellow]}, {field: tpg_costkpiname, op: in, values: [Red, Yellow]}, {field: tpg_issuekpiname, op: in, values: [Red, Yellow]}]}]}}
  - key: slip_vs_baseline_median
    label: Average slip vs first baseline (days)
    entity: tpg_project
    plain_rule: Average of planned deployment date minus first baselined date, over open projects with both dates. Positive means later than first planned. (A median cannot be computed on Dataverse yet.)
    expression: {agg: avg, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, value: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}}
  - key: slip_vs_baseline_avg
    label: Average slip vs first baseline (days)
    entity: tpg_project
    plain_rule: Average of planned deployment date minus first baselined date, over open projects with both dates.
    expression: {agg: avg, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, value: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}}
  - key: slip_vs_baseline_p85
    label: Largest slip vs first baseline (days)
    entity: tpg_project
    plain_rule: The largest slip (planned minus first baselined date) among open projects with both dates. (A percentile cannot be computed on Dataverse yet.)
    expression: {agg: max, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, value: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}}
  - key: overdue_over_90
    label: Overdue more than 90 days
    entity: tpg_project
    plain_rule: Overdue go-lives (in delivery, planned date before the reporting date, not deployed) more than 90 days past the planned date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_productdeploydate, op: <, value: {asof_offset_days: -90}}, {field: tpgmea_projectimpdate, op: is_null}]}}
  - key: most_overdue_days
    label: Most overdue (days)
    entity: tpg_project
    plain_rule: The largest number of days an overdue go-live is past its planned date, at the reporting date.
    expression: {agg: max, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_productdeploydate, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_projectimpdate, op: is_null}]}, value: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}}
  - key: deployed_projects
    label: Deployed projects
    entity: tpg_project
    plain_rule: Projects with an actual deployment date.
    expression: {agg: count, where: {field: tpgmea_projectimpdate, op: not_null}}
  - key: deployed_on_time
    label: Deployed on time
    entity: tpg_project
    plain_rule: Deployed projects whose actual deployment date is on or before the planned deployment date.
    expression: {agg: count, where: {all: [{field: tpgmea_projectimpdate, op: not_null}, {field: tpgmea_projectimpdate, op: <=, other_field: tpgmea_productdeploydate}]}}
  - key: median_schedule_variance
    label: Average schedule variance (days)
    entity: tpg_project
    plain_rule: Average of actual minus planned deployment date over deployed projects. Positive means late. (A median cannot be computed on Dataverse yet.)
    expression: {agg: avg, value: {days_from: tpgmea_productdeploydate, days_to: tpgmea_projectimpdate}}
  - key: deployed_over_60_late
    label: Deployed more than 60 days late
    entity: tpg_project
    plain_rule: Deployed projects whose actual deployment date is more than 60 days after the planned date.
    expression: {agg: count, where: {of: {days_from: tpgmea_productdeploydate, days_to: tpgmea_projectimpdate}, op: '>', value: 60}}
  - key: on_hold_over_90
    label: On hold more than 90 days
    entity: tpg_project
    plain_rule: Open projects on hold whose hold started more than 90 days before the reporting date (candidates to restart or drop).
    expression: {agg: count, where: {all: [{all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_projectstatusname, op: '=', value: On Hold}]}, {field: tpgmea_projectputonholddate, op: <, value: {asof_offset_days: -90}}]}}
  - key: longest_on_hold_days
    label: Longest on hold (days)
    entity: tpg_project
    plain_rule: Days from the hold date to the reporting date of the project on hold longest.
    expression: {agg: max, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_projectstatusname, op: '=', value: On Hold}]}, value: {days_from: tpgmea_projectputonholddate, days_to: {asof_offset_days: 0}}}
  - key: avg_on_hold_days
    label: Average time on hold (days)
    entity: tpg_project
    plain_rule: Average days from the hold date to the reporting date over projects on hold with a hold date.
    expression: {agg: avg, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_projectstatusname, op: '=', value: On Hold}]}, value: {days_from: tpgmea_projectputonholddate, days_to: {asof_offset_days: 0}}}
  - key: baselining_in_scope
    label: Past planning
    entity: tpg_project
    plain_rule: Open projects whose lifecycle phase is past Planning (not Assign PM, TRB Review, Initiation or Planning, and set).
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_lifecyclephase, op: not_null}, {field: tpg_lifecyclephase, op: not_in, values: [Assign PM, TRB Review, Initiation, Planning]}]}}
  - key: baselined
    label: Baselined
    entity: tpg_project
    plain_rule: Projects past Planning that have a first baselined deployment date.
    expression: {agg: count, where: {all: [{all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_lifecyclephase, op: not_null}, {field: tpg_lifecyclephase, op: not_in, values: [Assign PM, TRB Review, Initiation, Planning]}]}, {field: tpgmea_firstbaselinedpdd, op: not_null}]}}
  - key: baselining_compliance_pct
    label: Baselining compliance (%)
    entity: tpg_project
    plain_rule: Baselined projects as a share of open projects past Planning.
    expression: {op: div, left: {agg: count, where: {all: [{all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_lifecyclephase, op: not_null}, {field: tpg_lifecyclephase, op: not_in, values: [Assign PM, TRB Review, Initiation, Planning]}]}, {field: tpgmea_firstbaselinedpdd, op: not_null}]}}, right: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_lifecyclephase, op: not_null}, {field: tpg_lifecyclephase, op: not_in, values: [Assign PM, TRB Review, Initiation, Planning]}]}}, scale: 100}
  - key: budget_code_set
    label: With a budget code
    entity: tpg_project
    plain_rule: Projects in any state that carry a budget code (blank text counts as missing).
    expression: {agg: count, where: {all: [{field: tpgmea_budgetcode, op: not_null}, {field: tpgmea_budgetcode, op: '!=', value: ''}]}}
  - key: budget_code_compliance_pct
    label: Budget code compliance (%)
    entity: tpg_project
    plain_rule: Projects with a budget code as a share of all projects.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpgmea_budgetcode, op: not_null}, {field: tpgmea_budgetcode, op: '!=', value: ''}]}}, right: {agg: count}, scale: 100}
  - key: pm_assigned
    label: PM assigned
    entity: tpg_project
    plain_rule: Projects in delivery with a delivery manager.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_pdeliverymanager, op: not_null}]}}
  - key: pm_assignment_compliance_pct
    label: PM assignment compliance (%)
    entity: tpg_project
    plain_rule: Projects in delivery with a delivery manager as a share of projects in delivery.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_pdeliverymanager, op: not_null}]}}, right: {agg: count, where: {field: tpg_projectstatusname, op: '=', value: Active}}, scale: 100}
  - key: forecast_over_budget_15
    label: Forecast more than 15 % over budget
    entity: tpg_project
    plain_rule: Projects whose Total Forecast is more than 15 % above an approved budget above 0. Forecast cost is the project’s Total Forecast (tpg_totalforecast); EAC (Cost - Total) is not in this pack.
    expression: {agg: count, where: {all: [{field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {of: {calc: div, left: tpg_totalforecast, right: tpgmea_approvedbudgetvaluesusd}, op: '>', value: 1.15}]}}
  - key: net_forecast_variance
    label: Net forecast vs budget (USD)
    entity: tpg_project
    plain_rule: Sum of Total Forecast minus approved budget over projects in any state with a budget above 0 and a forecast. Positive means forecast above budget.
    expression: {agg: sum, where: {all: [{field: tpgmea_approvedbudgetvaluesusd, op: '>', value: 0}, {field: tpg_totalforecast, op: not_null}]}, value: {calc: sub, left: tpg_totalforecast, right: tpgmea_approvedbudgetvaluesusd}}
  - key: cost_internal_total
    label: 'Forecast cost: internal (USD)'
    entity: tpg_project
    plain_rule: Sum of the internal component of forecast cost (EAC).
    expression: {agg: sum, field: tpgmea_costinternalusd}
  - key: cost_external_total
    label: 'Forecast cost: external (USD)'
    entity: tpg_project
    plain_rule: Sum of the external component of forecast cost (EAC).
    expression: {agg: sum, field: tpgmea_costexternalusd}
  - key: cost_contingency_total
    label: 'Forecast cost: contingency (USD)'
    entity: tpg_project
    plain_rule: Sum of the contingency component of forecast cost (EAC).
    expression: {agg: sum, field: tpgmea_costcontingencyusd}
  - key: cost_hw_total
    label: 'Forecast cost: hardware (USD)'
    entity: tpg_project
    plain_rule: Sum of the hardware component of forecast cost (EAC).
    expression: {agg: sum, field: tpgmea_costhwusd}
  - key: cost_sw_total
    label: 'Forecast cost: software (USD)'
    entity: tpg_project
    plain_rule: Sum of the software component of forecast cost (EAC).
    expression: {agg: sum, field: tpgmea_costswusd}
  - key: north_star_on_time_tcv_pct
    label: TCV delivered on time (%)
    entity: tpg_project
    plain_rule: Estimated TCV of projects deployed in the 12 months to the reporting date within 30 days of their first baseline, as a share of the TCV of all projects deployed in those 12 months with a baseline.
    expression: {op: div, left: {agg: sum, field: tpgmea_estimatedtcvusd, where: {all: [{all: [{field: tpgmea_projectimpdate, op: '>', value: {asof_offset_days: -365}}, {field: tpgmea_projectimpdate, op: <=, value: {asof_offset_days: 0}}, {field: tpgmea_firstbaselinedpdd, op: not_null}]}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: <=, value: 30}]}}, right: {agg: sum, field: tpgmea_estimatedtcvusd, where: {all: [{field: tpgmea_projectimpdate, op: '>', value: {asof_offset_days: -365}}, {field: tpgmea_projectimpdate, op: <=, value: {asof_offset_days: 0}}, {field: tpgmea_firstbaselinedpdd, op: not_null}]}}, scale: 100}
  - key: lead_time_median
    label: Lead time, average (days)
    entity: tpg_project
    plain_rule: Average days from the originating request being raised to the project’s actual deployment, over deployed projects with a request. (A median cannot be computed on Dataverse yet.)
    expression: {agg: avg, value: {days_from: tpg_projectrequests.createdon, days_to: tpgmea_projectimpdate}}
  - key: lead_time_p85
    label: Lead time, longest (days)
    entity: tpg_project
    plain_rule: The longest lead time (request raised to deployment) among deployed projects with a request. (A percentile cannot be computed on Dataverse yet.)
    expression: {agg: max, value: {days_from: tpg_projectrequests.createdon, days_to: tpgmea_projectimpdate}}
  - key: throughput_go_lives_month
    label: Go-lives per month
    entity: tpg_project
    plain_rule: Projects deployed in the 12 months to the reporting date, divided by 12.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpgmea_projectimpdate, op: '>', value: {asof_offset_days: -365}}, {field: tpgmea_projectimpdate, op: <=, value: {asof_offset_days: 0}}]}}, right: 12}
  - key: project_starts_month
    label: Project starts per month
    entity: tpg_project
    plain_rule: Projects with an actual start date in the 12 months to the reporting date, divided by 12.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpgmea_projectactualstartdate, op: '>', value: {asof_offset_days: -365}}, {field: tpgmea_projectactualstartdate, op: <=, value: {asof_offset_days: 0}}]}}, right: 12}
  - key: months_to_clear_wip
    label: Months to clear WIP
    entity: tpg_project
    plain_rule: Open projects divided by the monthly go-lives of the last 12 months (blank when nothing went live).
    expression: {op: div, left: {agg: count, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}}, right: {agg: count, where: {all: [{field: tpgmea_projectimpdate, op: '>', value: {asof_offset_days: -365}}, {field: tpgmea_projectimpdate, op: <=, value: {asof_offset_days: 0}}]}}, scale: 12}
  - key: overdue_gates_total
    label: Overdue governance actions
    entity: tpg_projectrequests
    plain_rule: Overdue DOU, DARB and SOW gates on open requests, added up.
    expression: {op: add, left: {op: add, left: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_dourequiredname, op: '=', value: 'Yes'}, {field: tpgmea_planneddouissuancedate, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_dousubmissiondate, op: is_null}]}}, right: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_darbexempted, op: '=', value: false}, {field: tpgmea_darbreviewdate, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_darbapprovaltimestamp, op: is_null}]}}}, right: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_tentativedateofsowissuance, op: <, value: {asof_offset_days: 0}}, {field: tpgmea_sowissueddate, op: is_null}]}}}
  - key: requests_on_hold_over_180
    label: Requests on hold more than 180 days
    entity: tpg_projectrequests
    plain_rule: Requests on hold whose hold started more than 180 days before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_requeststatename, op: '=', value: On Hold}, {field: tpgmea_onholddate, op: <, value: {asof_offset_days: -180}}]}}
  - key: request_longest_on_hold_days
    label: Longest request hold (days)
    entity: tpg_projectrequests
    plain_rule: Days from the hold date to the reporting date of the request on hold longest.
    expression: {agg: max, where: {field: tpg_requeststatename, op: '=', value: On Hold}, value: {days_from: tpgmea_onholddate, days_to: {asof_offset_days: 0}}}
  - key: oldest_open_request_days
    label: Oldest open request (days)
    entity: tpg_projectrequests
    plain_rule: Days from the oldest open request being raised to the reporting date.
    expression: {agg: max, where: {field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, value: {days_from: createdon, days_to: {asof_offset_days: 0}}}
  - key: estimated_cost_total
    label: Estimated cost (USD)
    entity: tpg_projectrequests
    plain_rule: Sum of the internal, external, contingency, hardware and software cost recorded on requests. An estimate, not actual spend.
    expression: {op: add, left: {op: add, left: {op: add, left: {op: add, left: {agg: sum, field: tpgmea_costinternalusd}, right: {agg: sum, field: tpgmea_costexternalusd}}, right: {agg: sum, field: tpgmea_costcontingencyusd}}, right: {agg: sum, field: tpgmea_costhwusd}}, right: {agg: sum, field: tpgmea_costswusd}}
  - key: request_budget_total
    label: Request approved budget (USD)
    entity: tpg_projectrequests
    plain_rule: Sum of the approved budget recorded on requests.
    expression: {agg: sum, field: tpgmea_approvedbudgetvaluesusd}
  - key: requests_no_budget
    label: Requests with no budget yet
    entity: tpg_projectrequests
    plain_rule: Requests whose approved budget is blank or 0.
    expression: {agg: count, where: {any: [{field: tpgmea_approvedbudgetvaluesusd, op: is_null}, {field: tpgmea_approvedbudgetvaluesusd, op: <=, value: 0}]}}
  - key: approved_for_delivery
    label: Approved for delivery
    entity: tpg_projectrequests
    plain_rule: Requests in state Approved.
    expression: {agg: count, where: {field: tpg_requeststatename, op: '=', value: Approved}}
  - key: rejected_or_dropped
    label: Rejected or dropped
    entity: tpg_projectrequests
    plain_rule: Requests in state Rejected or Dropped.
    expression: {agg: count, where: {field: tpg_requeststatename, op: in, values: [Rejected, Dropped]}}
  - key: converted_requests
    label: Converted requests
    entity: tpg_project
    plain_rule: Distinct requests that at least one project names as its originating request (read from the project’s request lookup).
    expression: {agg: count_distinct, field: tpg_projectrequest, where: {field: tpg_projectrequest, op: not_null}}
  - key: conversion_rate
    label: Conversion rate (%)
    entity: tpg_projectrequests
    plain_rule: Converted requests as a share of all requests.
    expression: {op: div, left: {agg: count_distinct, field: tpg_projectrequestsid, where: {field: tpg_project.tpg_projectid, op: not_null}}, right: {agg: count_distinct, field: tpg_projectrequestsid}, scale: 100}
  - key: avg_days_to_convert
    label: Average days to convert
    entity: tpg_projectrequests
    plain_rule: Average days from a request being raised to its project being created, over converted requests (each project counts once).
    expression: {agg: avg, where: {field: tpg_project.tpg_projectid, op: not_null}, value: {days_from: createdon, days_to: tpg_project.createdon}}
  - key: discovery_completed
    label: Discovery completed
    entity: tpg_projectrequests
    plain_rule: Requests with a discovery actual end date and a planned end date.
    expression: {agg: count, where: {all: [{field: tpgmea_stage1discoveryactualenddate, op: not_null}, {field: tpgmea_stage1discoveryplannedenddate, op: not_null}]}}
  - key: discovery_late
    label: Discovery finished late
    entity: tpg_projectrequests
    plain_rule: Completed discoveries whose actual end is after the planned end.
    expression: {agg: count, where: {all: [{all: [{field: tpgmea_stage1discoveryactualenddate, op: not_null}, {field: tpgmea_stage1discoveryplannedenddate, op: not_null}]}, {field: tpgmea_stage1discoveryactualenddate, op: '>', other_field: tpgmea_stage1discoveryplannedenddate}]}}
  - key: discovery_early
    label: Discovery finished early
    entity: tpg_projectrequests
    plain_rule: Completed discoveries whose actual end is before the planned end.
    expression: {agg: count, where: {all: [{all: [{field: tpgmea_stage1discoveryactualenddate, op: not_null}, {field: tpgmea_stage1discoveryplannedenddate, op: not_null}]}, {field: tpgmea_stage1discoveryactualenddate, op: <, other_field: tpgmea_stage1discoveryplannedenddate}]}}
  - key: discovery_on_time
    label: Discovery finished on time
    entity: tpg_projectrequests
    plain_rule: Completed discoveries whose actual end equals the planned end.
    expression: {agg: count, where: {all: [{all: [{field: tpgmea_stage1discoveryactualenddate, op: not_null}, {field: tpgmea_stage1discoveryplannedenddate, op: not_null}]}, {field: tpgmea_stage1discoveryactualenddate, op: '=', other_field: tpgmea_stage1discoveryplannedenddate}]}}
  - key: effort_internal_md
    label: Internal effort (man-days)
    entity: tpg_projectrequests
    plain_rule: Sum of the internal effort estimated on requests, in man-days.
    expression: {agg: sum, field: tpgmea_totalinternalmds}
  - key: effort_external_md
    label: External effort (man-days)
    entity: tpg_projectrequests
    plain_rule: Sum of the external effort estimated on requests, in man-days.
    expression: {agg: sum, field: tpgmea_totalexternalmds}
  - key: effort_saba_md
    label: SA/BA effort (man-days)
    entity: tpg_projectrequests
    plain_rule: Sum of the solution and business analysis effort planned on requests, in man-days.
    expression: {agg: sum, field: tpgmea_baplannedefforts}
  - key: requests_no_effort_estimate
    label: Requests with no effort estimate
    entity: tpg_projectrequests
    plain_rule: Requests with neither an internal nor an external effort estimate.
    expression: {agg: count, where: {all: [{field: tpgmea_totalinternalmds, op: is_null}, {field: tpgmea_totalexternalmds, op: is_null}]}}
  - key: tcv_open_total
    label: Estimated TCV of open projects
    entity: tpg_project
    plain_rule: Sum of the estimated total contract value of open projects (blank values are not counted).
    expression: {agg: sum, field: tpgmea_estimatedtcvusd, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}}
  - key: staged_open_projects
    label: Open projects with a stage schedule
    entity: tpg_project
    plain_rule: Open projects with at least one stage planned end date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpgmea_planningstagedate, op: not_null}, {field: tpgmea_designedstagedate, op: not_null}, {field: tpgmea_buildenddate, op: not_null}, {field: tpgmea_testenddate, op: not_null}, {field: tpgmea_implementationenddate, op: not_null}, {field: tpgmea_warrantyandclosurestagedate, op: not_null}]}]}}
  - key: planning_end_passed
    label: Planning end passed
    entity: tpg_project
    plain_rule: Open projects whose planning stage planned end is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_planningstagedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: design_end_passed
    label: Design end passed
    entity: tpg_project
    plain_rule: Open projects whose design stage planned end is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_designedstagedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: build_end_passed
    label: Build end passed
    entity: tpg_project
    plain_rule: Open projects whose build stage planned end is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_buildenddate, op: <, value: {asof_offset_days: 0}}]}}
  - key: test_end_passed
    label: Test end passed
    entity: tpg_project
    plain_rule: Open projects whose test stage planned end is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_testenddate, op: <, value: {asof_offset_days: 0}}]}}
  - key: implementation_end_passed
    label: Implementation end passed
    entity: tpg_project
    plain_rule: Open projects whose implementation stage planned end is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_implementationenddate, op: <, value: {asof_offset_days: 0}}]}}
  - key: warranty_end_passed
    label: Warranty end passed
    entity: tpg_project
    plain_rule: Open projects whose warranty and closure stage planned end is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_warrantyandclosurestagedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: completed_projects
    label: Completed projects
    entity: tpg_project
    plain_rule: Projects whose current state is Completed.
    expression: {agg: count, where: {field: tpg_projectstatusname, op: '=', value: Completed}}
  - key: closure_approved
    label: Closure approved
    entity: tpg_project
    plain_rule: Completed projects whose closure approval is Approved.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Completed}, {field: tpgmea_closeapprovalstatus, op: '=', value: Approved}]}}
  - key: closure_compliance_pct
    label: Closure compliance (%)
    entity: tpg_project
    plain_rule: Completed projects with closure approved as a share of completed projects.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Completed}, {field: tpgmea_closeapprovalstatus, op: '=', value: Approved}]}}, right: {agg: count, where: {field: tpg_projectstatusname, op: '=', value: Completed}}, scale: 100}
  - key: closure_in_approval
    label: Closure approval in progress
    entity: tpg_project
    plain_rule: Projects in any state whose closure approval is in progress.
    expression: {agg: count, where: {field: tpgmea_closeapprovalstatus, op: '=', value: Approval In Progress}}
  - key: closure_overdue
    label: Closure overdue
    entity: tpg_project
    plain_rule: 'DRAFT: completed projects without closure approval whose warranty and closure stage planned end is before the reporting date.'
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: '=', value: Completed}, {any: [{field: tpgmea_closeapprovalstatus, op: is_null}, {field: tpgmea_closeapprovalstatus, op: '!=', value: Approved}]}, {field: tpgmea_warrantyandclosurestagedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: status_reporting_scope
    label: Projects expected to report
    entity: tpg_project
    plain_rule: Projects in delivery (current state Active), each counted once.
    expression: {agg: count_distinct, field: tpg_projectid, where: {field: tpg_projectstatusname, op: '=', value: Active}}
  - key: reported_last_30d
    label: Reported in the last 30 days
    entity: tpg_project
    plain_rule: 'DRAFT: projects in delivery with at least one status report dated from 30 days before the reporting date up to the reporting date.'
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpg_statusreport.tpg_reportdate, op: '>=', value: {asof_offset_days: -30}}, {field: tpg_statusreport.tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}}
  - key: status_reporting_compliance_pct
    label: Status reporting compliance (%)
    entity: tpg_project
    plain_rule: Projects in delivery that reported in the last 30 days as a share of projects in delivery.
    expression: {op: div, left: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpg_statusreport.tpg_reportdate, op: '>=', value: {asof_offset_days: -30}}, {field: tpg_statusreport.tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}}, right: {agg: count_distinct, field: tpg_projectid, where: {field: tpg_projectstatusname, op: '=', value: Active}}, scale: 100}
  - key: status_reports_30d
    label: Status reports in the last 30 days
    entity: tpg_statusreport
    plain_rule: Status reports dated from 30 days before the reporting date up to the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_reportdate, op: '>=', value: {asof_offset_days: -30}}, {field: tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}}
  - key: status_reports_total
    label: Status reports
    entity: tpg_statusreport
    plain_rule: Every status report record.
    expression: {agg: count}
  - key: days_since_latest_report
    label: Days since the latest report
    entity: tpg_statusreport
    plain_rule: Whole days from the most recent status report on or before the reporting date to the reporting date.
    expression: {agg: min, where: {field: tpg_reportdate, op: <=, value: {asof_offset_days: 0}}, value: {days_from: tpg_reportdate, days_to: {asof_offset_days: 0}}}
  - key: total_pcrs
    label: PCRs
    entity: tpg_change
    plain_rule: Every project change request (PCR), including initial-baseline PCRs.
    expression: {agg: count}
  - key: pcrs_approved
    label: PCRs fully approved
    entity: tpg_change
    plain_rule: PCRs whose approval is Fully Approved.
    expression: {agg: count, where: {field: tpg_approvalname, op: '=', value: Fully Approved}}
  - key: pcrs_pending
    label: PCRs awaiting approval
    entity: tpg_change
    plain_rule: 'PCRs not yet fully approved and not rejected: Not Yet Requested, Approval In Progress, Requested By (RM) Approved, Delivery Manager Approved.'
    expression: {agg: count, where: {field: tpg_approvalname, op: in, values: [Not Yet Requested, Approval In Progress, Requested By (RM) Approved, Delivery Manager Approved]}}
  - key: pcrs_rejected
    label: PCRs rejected
    entity: tpg_change
    plain_rule: PCRs whose approval is Requested By (RM) Rejected.
    expression: {agg: count, where: {field: tpg_approvalname, op: '=', value: Requested By (RM) Rejected}}
  - key: pcr_approval_pct
    label: PCR approval (%)
    entity: tpg_change
    plain_rule: Fully approved PCRs as a share of all PCRs.
    expression: {op: div, left: {agg: count, where: {field: tpg_approvalname, op: '=', value: Fully Approved}}, right: {agg: count}, scale: 100}
  - key: pcrs_golive_change
    label: PCRs changing the go-live
    entity: tpg_change
    plain_rule: PCRs that change the planned go-live date.
    expression: {agg: count, where: {field: tpgmea_changeinplannedgolivedate, op: '=', value: true}}
  - key: pcr_additional_cost
    label: Additional cost from PCRs
    entity: tpg_change
    plain_rule: Sum of the additional cost recorded on PCRs (an estimate, not money spent).
    expression: {agg: sum, field: tpgmea_additionalcostusd}
  - key: projects_with_pcr
    label: Projects with a PCR
    entity: tpg_change
    plain_rule: Distinct projects with at least one PCR.
    expression: {agg: count_distinct, field: tpg_project}
  - key: open_risks
    label: Open risks
    entity: tpg_risk
    plain_rule: Risks whose state is Active (trimmed).
    expression: {agg: count, where: {field: tpg_statename, op: '=', value: Active}}
  - key: high_exposure_risks
    label: High-exposure risks
    entity: tpg_risk
    plain_rule: 'DRAFT: open (Active) risks whose likelihood × consequence is 15 or more.'
    expression: {agg: count, where: {all: [{field: tpg_statename, op: '=', value: Active}, {any: [{all: [{field: tpg_likelihood, op: '>=', value: 3}, {field: tpg_consequence, op: '>=', value: 5}]}, {all: [{field: tpg_likelihood, op: '>=', value: 4}, {field: tpg_consequence, op: '>=', value: 4}]}, {all: [{field: tpg_likelihood, op: '>=', value: 5}, {field: tpg_consequence, op: '>=', value: 3}]}]}]}}
  - key: risk_cost_exposure
    label: Cost exposure of open risks
    entity: tpg_risk
    plain_rule: Sum of the cost exposure of open (Active) risks (an estimate of what a risk could cost).
    expression: {agg: sum, field: tpg_costexposure, where: {field: tpg_statename, op: '=', value: Active}}
  - key: overdue_risks
    label: Risks past their due date
    entity: tpg_risk
    plain_rule: Open risks whose due date is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_statename, op: '=', value: Active}, {field: tpg_duedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: open_issues
    label: Open issues
    entity: tpg_issue
    plain_rule: Issues whose status is not Closed (a blank status counts as open).
    expression: {agg: count, where: {field: tpg_statusname, op: '=', value: Active}}
  - key: high_priority_issues
    label: High-priority open issues
    entity: tpg_issue
    plain_rule: Open issues with priority High or Critical.
    expression: {agg: count, where: {all: [{field: tpg_statusname, op: '=', value: Active}, {field: tpg_priorityname, op: in, values: [High, Critical]}]}}
  - key: overdue_issues
    label: Issues past their due date
    entity: tpg_issue
    plain_rule: Open issues whose due date is before the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_statusname, op: '=', value: Active}, {field: tpg_duedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: open_actions
    label: Open action items
    entity: tpg_actionitem
    plain_rule: Action items not Completed or Deferred; a blank state counts as open.
    expression: {agg: count, where: {any: [{field: tpg_statename, op: is_null}, {field: tpg_statename, op: not_in, values: [Completed, Deferred]}]}}
  - key: overdue_actions
    label: Overdue action items
    entity: tpg_actionitem
    plain_rule: Action items not Completed or Deferred (blank counts as open) whose due date is before the reporting date; due on the reporting date is not overdue.
    expression: {agg: count, where: {all: [{any: [{field: tpg_statename, op: is_null}, {field: tpg_statename, op: not_in, values: [Completed, Deferred]}]}, {field: tpg_duedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: open_decisions
    label: Open decisions
    entity: tpg_decision
    plain_rule: Decisions whose status is not Completed (a blank status counts as open).
    expression: {agg: count, where: {any: [{field: tpg_statusname, op: is_null}, {field: tpg_statusname, op: not_in, values: [Completed]}]}}
  - key: hours_logged
    label: Hours logged
    entity: tpg_timesheet
    plain_rule: Hours on timesheets that are Approved or Submitted (drafts and rejected lines are not counted).
    expression: {agg: sum, field: tpg_total, where: {field: tpg_statusname, op: in, values: [Approved, Submitted]}}
  - key: hours_approved
    label: Hours approved
    entity: tpg_timesheet
    plain_rule: Hours on Approved timesheets.
    expression: {agg: sum, field: tpg_total, where: {field: tpg_statusname, op: '=', value: Approved}}
  - key: hours_awaiting_approval
    label: Hours awaiting approval
    entity: tpg_timesheet
    plain_rule: Hours on Submitted timesheets.
    expression: {agg: sum, field: tpg_total, where: {field: tpg_statusname, op: '=', value: Submitted}}
  - key: hours_all
    label: Hours on timesheets
    entity: tpg_timesheet
    plain_rule: Hours on every timesheet line, in any status.
    expression: {agg: sum, field: tpg_total}
  - key: people_logging
    label: People logging time
    entity: tpg_timesheet
    plain_rule: Distinct people with Approved or Submitted hours.
    expression: {agg: count_distinct, field: tpg_submitter, where: {field: tpg_statusname, op: in, values: [Approved, Submitted]}}
  - key: projects_with_time
    label: Projects with time logged
    entity: tpg_timesheet
    plain_rule: Distinct projects with Approved or Submitted hours.
    expression: {agg: count_distinct, field: tpg_project, where: {field: tpg_statusname, op: in, values: [Approved, Submitted]}}
  - key: projects_with_tasks
    label: Projects with a task plan
    entity: tpg_projecttask
    plain_rule: Distinct projects with at least one task.
    expression: {agg: count_distinct, field: tpg_project}
  - key: plan_tasks
    label: Plan tasks
    entity: tpg_projecttask
    plain_rule: Tasks that are not summary rows.
    expression: {agg: count, where: {any: [{field: tpg_issummary, op: is_null}, {field: tpg_issummary, op: '!=', value: true}]}}
  - key: critical_open_tasks
    label: Open critical tasks
    entity: tpg_projecttask
    plain_rule: Tasks on the critical path, not summary rows, with progress below 100 % (blank progress counts as open).
    expression: {agg: count, where: {all: [{field: tpg_iscritical, op: '=', value: true}, {any: [{field: tpg_issummary, op: is_null}, {field: tpg_issummary, op: '!=', value: true}]}, {any: [{field: tpg_progress, op: is_null}, {field: tpg_progress, op: <, value: 100}]}]}}
  - key: critical_tasks_late
    label: Late critical tasks
    entity: tpg_projecttask
    plain_rule: Open critical tasks whose finish date is before the reporting date; finishing on the reporting date is not late.
    expression: {agg: count, where: {all: [{all: [{field: tpg_iscritical, op: '=', value: true}, {any: [{field: tpg_issummary, op: is_null}, {field: tpg_issummary, op: '!=', value: true}]}, {any: [{field: tpg_progress, op: is_null}, {field: tpg_progress, op: <, value: 100}]}]}, {field: tpg_finish, op: <, value: {asof_offset_days: 0}}]}}
  - key: open_requests_with_code
    label: Open requests with a budget code
    entity: tpg_projectrequests
    plain_rule: Open requests (New, Active, On Hold, Return to Requester) that carry a budget code (blank text counts as missing).
    expression: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_budgetcode, op: not_null}, {field: tpgmea_budgetcode, op: '!=', value: ''}]}}
  - key: request_budget_code_pct
    label: Request budget code compliance (%)
    entity: tpg_projectrequests
    plain_rule: Open requests with a budget code as a share of open requests.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_budgetcode, op: not_null}, {field: tpgmea_budgetcode, op: '!=', value: ''}]}}, right: {agg: count, where: {field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}}, scale: 100}
  - key: open_requests_with_dm
    label: Open requests with a delivery manager
    entity: tpg_projectrequests
    plain_rule: Open requests with a delivery manager.
    expression: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_deliverymanager, op: not_null}]}}
  - key: request_pm_assignment_pct
    label: Request PM assignment (%)
    entity: tpg_projectrequests
    plain_rule: Open requests with a delivery manager as a share of open requests.
    expression: {op: div, left: {agg: count, where: {all: [{field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}, {field: tpgmea_deliverymanager, op: not_null}]}}, right: {agg: count, where: {field: tpg_requeststatename, op: in, values: [New, Active, On Hold, Return to Requester]}}, scale: 100}
  - key: change_request_count
    label: Change requests
    entity: tpg_projectrequests
    plain_rule: Requests marked as a change request (CR) to an existing project.
    expression: {agg: count, where: {field: tpgmea_isthisacrrequest, op: '=', value: true}}
  - key: crs_with_master_project
    label: CRs naming their project
    entity: tpg_projectrequests
    plain_rule: Change requests that name the master project they change.
    expression: {agg: count, where: {all: [{field: tpgmea_isthisacrrequest, op: '=', value: true}, {field: tpgmea_masterprojectidforcr, op: not_null}]}}
  - key: cr_share_pct
    label: Change request share (%)
    entity: tpg_projectrequests
    plain_rule: Change requests as a share of all requests.
    expression: {op: div, left: {agg: count, where: {field: tpgmea_isthisacrrequest, op: '=', value: true}}, right: {agg: count}, scale: 100}
  - key: slipped_projects
    label: Slipped against the first baseline
    entity: tpg_project
    plain_rule: 'Open projects with a first-baselined go-live that are later than it: live projects whose actual go-live is after it; not-yet-live projects whose planned go-live (still ahead) is after it; and not-yet-live projects whose planned go-live has passed and the reporting date is after it.'
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {any: [{all: [{field: tpgmea_projectimpdate, op: not_null}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: {asof_offset_days: 0}, days_to: tpgmea_productdeploydate}, op: '>=', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}, op: '>', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}, op: '>', value: 0}]}]}]}}
  - key: slip_days_total
    label: Days slipped
    entity: tpg_project
    plain_rule: 'Sum of slip days over slipped open projects: actual go-live − first baseline for live projects, planned go-live − first baseline while the planned date is ahead, reporting date − first baseline once it has passed.'
    expression: {op: add, left: {agg: sum, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {field: tpgmea_projectimpdate, op: not_null}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: '>', value: 0}]}, value: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}}, right: {op: add, left: {agg: sum, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: {asof_offset_days: 0}, days_to: tpgmea_productdeploydate}, op: '>=', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}, op: '>', value: 0}]}, value: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}}, right: {agg: sum, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}, op: '>', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}, op: '>', value: 0}]}, value: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}}}}
  - key: slipped_with_pcr
    label: Slipped, with a PCR beyond baseline
    entity: tpg_project
    plain_rule: Slipped open projects (as in Slipped against the first baseline) with at least one PCR whose change type is not Initial Baseline, any approval status.
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {any: [{all: [{field: tpgmea_projectimpdate, op: not_null}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: {asof_offset_days: 0}, days_to: tpgmea_productdeploydate}, op: '>=', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}, op: '>', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}, op: '>', value: 0}]}]}, {field: tpg_change.tpg_changetypename, op: '!=', value: Initial Baseline}]}}
  - key: slipped_no_pcr
    label: Slipped, no PCR beyond baseline
    entity: tpg_project
    plain_rule: 'Slipped open projects minus those with a PCR beyond the Initial Baseline: the slip was never put through change control.'
    expression: {op: sub, left: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {any: [{all: [{field: tpgmea_projectimpdate, op: not_null}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: {asof_offset_days: 0}, days_to: tpgmea_productdeploydate}, op: '>=', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}, op: '>', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}, op: '>', value: 0}]}]}]}}, right: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {any: [{all: [{field: tpgmea_projectimpdate, op: not_null}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: {asof_offset_days: 0}, days_to: tpgmea_productdeploydate}, op: '>=', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}, op: '>', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}, op: '>', value: 0}]}]}, {field: tpg_change.tpg_changetypename, op: '!=', value: Initial Baseline}]}}}
  - key: slipped_fully_approved_pcr
    label: Slipped, with a fully approved PCR
    entity: tpg_project
    plain_rule: Slipped open projects with at least one Fully Approved PCR whose change type is not Initial Baseline.
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: not_null}, {any: [{all: [{field: tpgmea_projectimpdate, op: not_null}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_projectimpdate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: {asof_offset_days: 0}, days_to: tpgmea_productdeploydate}, op: '>=', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: tpgmea_productdeploydate}, op: '>', value: 0}]}, {all: [{field: tpgmea_projectimpdate, op: is_null}, {of: {days_from: tpgmea_productdeploydate, days_to: {asof_offset_days: 0}}, op: '>', value: 0}, {of: {days_from: tpgmea_firstbaselinedpdd, days_to: {asof_offset_days: 0}}, op: '>', value: 0}]}]}, {field: tpg_change.tpg_changetypename, op: '!=', value: Initial Baseline}, {field: tpg_change.tpg_approvalname, op: '=', value: Fully Approved}]}}
  - key: no_first_baseline
    label: No first-baselined go-live
    entity: tpg_project
    plain_rule: Open projects whose first-baselined deployment date is empty.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: is_null}]}}
  - key: no_first_baseline_with_ib_pcr
    label: No first baseline, but an Initial Baseline PCR
    entity: tpg_project
    plain_rule: 'Each project counted once: no first-baselined date on the project, at least one PCR of type Initial Baseline.'
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_firstbaselinedpdd, op: is_null}, {field: tpg_change.tpg_changetypename, op: '=', value: Initial Baseline}]}}
  - key: reported_green
    label: Reported Green
    entity: tpg_project
    plain_rule: Open projects with overall KPI Green.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: '=', value: Green}]}}
  - key: green_hard_warning
    label: Greens carrying a hard warning
    entity: tpg_project
    plain_rule: Open projects reported Green that are overdue, name a blocker on a status report in the last 30 days, have an overdue action, or have a late unfinished task flagged critical. (Slipped with no PCR is shown separately as Slipped, no PCR beyond baseline.)
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_overallkpiname, op: '=', value: Green}, {any: [{all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_projectimpdate, op: is_null}, {field: tpgmea_productdeploydate, op: <, value: {asof_offset_days: 0}}]}, {all: [{field: tpg_statusreport.tpgmea_keyblockers, op: not_null}, {field: tpg_statusreport.tpg_reportdate, op: '>=', value: {asof_offset_days: -30}}, {field: tpg_statusreport.tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}, {all: [{any: [{field: tpg_actionitem.tpg_statename, op: is_null}, {field: tpg_actionitem.tpg_statename, op: not_in, values: [Completed, Deferred]}]}, {field: tpg_actionitem.tpg_duedate, op: <, value: {asof_offset_days: 0}}]}, {all: [{field: tpg_projecttask.tpg_iscritical, op: '=', value: true}, {field: tpg_projecttask.tpg_finish, op: <, value: {asof_offset_days: 0}}, {any: [{field: tpg_projecttask.tpg_progress, op: is_null}, {field: tpg_projecttask.tpg_progress, op: <, value: 100}]}]}]}]}}
  - key: trouble_projects
    label: Projects in trouble
    entity: tpg_project
    plain_rule: Open projects reported Red, or in delivery past their planned go-live with no actual go-live.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpg_overallkpiname, op: '=', value: Red}, {all: [{field: tpg_projectstatusname, op: '=', value: Active}, {field: tpgmea_projectimpdate, op: is_null}, {field: tpgmea_productdeploydate, op: <, value: {asof_offset_days: 0}}]}]}]}}
  - key: named_blocker_projects
    label: Blocker named in the last 30 days
    entity: tpg_project
    plain_rule: Open projects with key blockers filled in on a status report dated in the 30 days up to the reporting date.
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_statusreport.tpgmea_keyblockers, op: not_null}, {field: tpg_statusreport.tpg_reportdate, op: '>=', value: {asof_offset_days: -30}}, {field: tpg_statusreport.tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}}
  - key: no_report_60d
    label: No status report in 60 days
    entity: tpg_project
    plain_rule: Open projects minus those with a status report dated in the 60 days up to the reporting date (so projects that never reported are included). Not the same as Stale projects (no edit for 30 days).
    expression: {op: sub, left: {agg: count, where: {field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}}, right: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_statusreport.tpg_reportdate, op: '>=', value: {asof_offset_days: -60}}, {field: tpg_statusreport.tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}}}
  - key: late_critical_task_projects
    label: Projects with a late critical task
    entity: tpg_project
    plain_rule: Open projects with a task where is critical = Yes, finish before the reporting date and progress below 100 or blank.
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpg_projecttask.tpg_iscritical, op: '=', value: true}, {field: tpg_projecttask.tpg_finish, op: <, value: {asof_offset_days: 0}}, {any: [{field: tpg_projecttask.tpg_progress, op: is_null}, {field: tpg_projecttask.tpg_progress, op: <, value: 100}]}]}}
  - key: overdue_action_projects
    label: Projects with an overdue action
    entity: tpg_project
    plain_rule: Open projects with an action not Completed or Deferred whose due date is before the reporting date.
    expression: {agg: count_distinct, field: tpg_projectid, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpg_actionitem.tpg_statename, op: is_null}, {field: tpg_actionitem.tpg_statename, op: not_in, values: [Completed, Deferred]}]}, {field: tpg_actionitem.tpg_duedate, op: <, value: {asof_offset_days: 0}}]}}
  - key: go_lives_next_90
    label: Go-lives in the next 90 days
    entity: tpg_project
    plain_rule: Open projects with no actual go-live whose planned go-live is from the reporting date to 90 days after it. Planned go-lives only, never stage end dates.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_projectimpdate, op: is_null}, {field: tpgmea_productdeploydate, op: '>=', value: {asof_offset_days: 0}}, {field: tpgmea_productdeploydate, op: <=, value: {asof_offset_days: 90}}]}}
  - key: no_delivery_manager
    label: No delivery manager
    entity: tpg_project
    plain_rule: Open projects whose delivery manager is empty.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_pdeliverymanager, op: is_null}]}}
  - key: no_cio
    label: No CIO
    entity: tpg_project
    plain_rule: Open projects whose CIO is empty.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {field: tpgmea_customcio, op: is_null}]}}
  - key: missing_stage_date
    label: Missing a stage date
    entity: tpg_project
    plain_rule: Open projects where at least one of the S2 Plan … S7 Warranty & Closure planned end dates is empty.
    expression: {agg: count, where: {all: [{field: tpg_projectstatusname, op: in, values: [Project Created, Active, On Hold]}, {any: [{field: tpgmea_planningstagedate, op: is_null}, {field: tpgmea_designedstagedate, op: is_null}, {field: tpgmea_buildenddate, op: is_null}, {field: tpgmea_testenddate, op: is_null}, {field: tpgmea_implementationenddate, op: is_null}, {field: tpgmea_warrantyandclosurestagedate, op: is_null}]}]}}
  - key: pcrs_beyond_baseline
    label: Change requests beyond the baseline
    entity: tpg_change
    plain_rule: PCRs whose change type is not Initial Baseline, whatever their approval status.
    expression: {agg: count, where: {field: tpg_changetypename, op: '!=', value: Initial Baseline}}
  - key: pcrs_last_7d
    label: PCRs raised in the last 7 days
    entity: tpg_change
    plain_rule: PCRs whose requested date is in the 7 days up to and including the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_requesteddate, op: '>=', value: {asof_offset_days: -7}}, {field: tpg_requesteddate, op: <=, value: {asof_offset_days: 0}}]}}
  - key: status_reports_7d
    label: Status reports in the last 7 days
    entity: tpg_statusreport
    plain_rule: Status reports whose report date is in the 7 days up to and including the reporting date.
    expression: {agg: count, where: {all: [{field: tpg_reportdate, op: '>=', value: {asof_offset_days: -7}}, {field: tpg_reportdate, op: <=, value: {asof_offset_days: 0}}]}}
  - key: open_actions_no_due_date
    label: Open actions with no due date
    entity: tpg_actionitem
    plain_rule: Action items not Completed or Deferred with an empty due date.
    expression: {agg: count, where: {all: [{any: [{field: tpg_statename, op: is_null}, {field: tpg_statename, op: not_in, values: [Completed, Deferred]}]}, {field: tpg_duedate, op: is_null}]}}
  - key: approved_named_by_project
    label: Approved requests named by a project
    entity: tpg_projectrequests
    plain_rule: Requests in state Approved that some project names in its request lookup; each request once.
    expression: {agg: count_distinct, field: tpg_projectrequestsid, where: {all: [{field: tpg_requeststatename, op: '=', value: Approved}, {field: tpg_project.tpg_projectid, op: not_null}]}}
  - key: approved_no_project
    label: Approved requests with no project
    entity: tpg_projectrequests
    plain_rule: Requests in state Approved that no project names in its request lookup. Some may be linked only through the request's Project Link.
    expression: {agg: count_distinct, field: tpg_projectrequestsid, where: {all: [{field: tpg_requeststatename, op: '=', value: Approved}, {field: tpg_project.tpg_projectid, op: is_null}]}}
  - key: request_to_darb_median
    label: Request → DARB approval (average days)
    entity: tpg_projectrequests
    plain_rule: Average days from client request date to DARB approval date, over requests a project names. (A median cannot be computed on Dataverse yet.)
    expression: {agg: avg, where: {field: tpg_project.tpg_projectid, op: not_null}, value: {days_from: tpgmea_clientrequestdate, days_to: tpgmea_darbapprovaltimestamp}}
  - key: darb_to_project_median
    label: DARB approval → project created (average days)
    entity: tpg_projectrequests
    plain_rule: Average days from DARB approval date to the created date of the request’s projects. (A median cannot be computed on Dataverse yet.)
    expression: {agg: avg, where: {field: tpg_project.tpg_projectid, op: not_null}, value: {days_from: tpgmea_darbapprovaltimestamp, days_to: tpg_project.createdon}}
  - key: project_to_baseline_median
    label: Project created → first baseline (average days)
    entity: tpg_projectrequests
    plain_rule: Average days from the created date of the request’s projects to their first-baselined go-live. (A median cannot be computed on Dataverse yet.)
    expression: {agg: avg, where: {field: tpg_project.tpg_projectid, op: not_null}, value: {days_from: tpg_project.createdon, days_to: tpg_project.tpgmea_firstbaselinedpdd}}
  - key: request_hours
    label: Hours on requests
    entity: tpgmea_projectrequesttimesheet
    plain_rule: Sum of total hours on request timesheet lines.
    expression: {agg: sum, field: tpg_total}
  - key: requests_with_hours
    label: Requests with hours logged
    entity: tpgmea_projectrequesttimesheet
    plain_rule: Distinct requests named on request timesheet lines.
    expression: {agg: count_distinct, field: tpgmea_prtprojectrequest}

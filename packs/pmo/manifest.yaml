# PMO starter pack for TPG (FEAT-051; US-037 – US-039; RULE-026 – RULE-039).
#
# Measures are data, not code: each expression is the typed AST compiled by the query engine.
# Field candidates list the synthetic extract name first, then the Dataverse / CRM logical name
# (db_scheme §18). 1.2.0: status, current state and request state also bind to Dataverse's standard
# statecode / statuscode choices through the label columns the TDS endpoint exposes (statecodename,
# statuscodename), and the request key to tpg_projectrequestid (US-110). Rules are the reference rules from business_rules.md and still need STK-008
# sign-off (DEC-19). "asof_offset_days" is relative to the reporting date (RULE-018).
# 1.3.0 (US-156): the report catalogue's measures and dimensions — health, slip, lateness, aging, compliance,
# cost components, demand effort, conversion and flow — with a one-line definition on every measure, banded
# dimensions (aging, go-live horizon, variance spread) and the catalogue's columns, bound to the real TPG
# Dataverse names where they exist (see the field check in task.md US-156).
# 1.3.1 (US-158): every starter report states its population and data limits in a footnote; callouts where a
# figure needs a caveat; detail tables (records with the catalogue's columns, default sort, export name).
# 2.0.0 (US-155): Starter Pack 2.0 replaces the 1.x starter reports. The starter reports are the report blueprints
# (report_blueprints.yaml, read through ``reports_from``): the PMO — Projects and PMO — Requests dashboards with the
# catalogue's screens as tabs. Bound first to the real TPG Dataverse names (decision D1): current state
# tpg_projectstatusname, request state tpg_requeststatename, planned go-live tpgmea_productdeploydate. New entities
# for the screens the TPG source supports beyond projects and requests: PCRs (tpg_change), status reports, risks,
# issues, action items, decisions, timesheets and project tasks, each linked to its project.
# 2.1.0 (US-194): dimensions name the question shapes they answer (``answers``): hold and change reasons "why",
# time on hold and request age "how long", days past go-live and schedule variance "how late", go-live horizon
# "when". The rules planner adds that breakdown when a question asks that way. Timesheets get a date (Entered on), so
# "hours per month" is read on their own date, not the project's go-live.
# 2.2.0 (US-202, DEC-24): an open project is one whose current state is Project Created, Active or On Hold (RULE-026),
# as the Dataverse model counts it; Closed projects are every other state. Status stays the record state
# (statecode): on TPG Dataverse every project, completed or dropped, is record-Active, so it can't tell open from closed.
pack_key: pmo_tpg
pack_version: 2.2.1
title: PMO starter pack (TPG)
released_at: "2026-10-27T00:00:00Z"

signature:
  # A connection matches when every required field of the primary entity is present. Confidence is the
  # share of pack fields found; a low-confidence match still installs, with missing items Unavailable.
  primary_entity: projects
  # 1.3.0 lowered from 0.15: the catalogue fields grew the pack to 72 fields, so the same 9-column extract
  # now finds 12.5 % (the required project fields still have to be there).
  # 2.0.0 lowered to 0.05: the activity entities (US-155) grew the pack to ~160 fields.
  min_confidence: 0.05

entities:
  - key: projects
    label: Projects
    grain: One row per project
    object_candidates: [projects, tpg_project]
    primary_key: [project_id]
    display_fields: [project_number, name, region, cio, current_state, delivery_manager, planned_deployment_date, actual_deployment_date]
    fields:
      - {key: project_id, label: Project id, data_type: text, semantic_type: identifier, required: true, columns: [project_id, tpg_projectid]}
      - {key: project_number, label: Project number, data_type: text, semantic_type: identifier, columns: [project_number, tpgmea_projectnumber, tpgmea_pprojectnumber]}
      - {key: name, label: Project name, data_type: text, columns: [name, tpg_title, tpg_name]}
      - {key: portfolio, label: Portfolio, data_type: text, columns: [portfolio]}
      - {key: program, label: Programme, data_type: text, columns: [program, programme]}
      - {key: status, label: Status, data_type: text, required: true, columns: [status, statecodename], blank_handling: "Blank status is excluded and counted as 'status not set'."}
      - {key: current_state, label: Current state, data_type: text, required: true, columns: [current_state, tpg_projectstatusname, statuscodename]}
      - {key: lifecycle_phase, label: Lifecycle phase, data_type: text, columns: [lifecycle_phase]}
      - {key: cio, label: CIO, data_type: text, sensitivity: personal, semantic_type: person_name, columns: [cio, tpgmea_customcio]}
      - {key: region, label: Region, data_type: text, columns: [region, tpgmea_region]}
      - {key: delivery_manager, label: Delivery manager, data_type: text, sensitivity: personal, semantic_type: person_name, columns: [delivery_manager, tpgmea_deliverymanager]}
      - {key: project_manager, label: Project manager, data_type: text, sensitivity: personal, semantic_type: person_name, columns: [project_manager, tpgmea_pdeliverymanager]}
      - {key: priority, label: Priority, data_type: text, columns: [priority]}
      - {key: platform, label: Platform, data_type: text, columns: [platform]}
      - {key: key_priority_project, label: Key priority project, data_type: text, columns: [key_priority_project, tpgmea_keypriorityprojectname]}
      - {key: percent_complete, label: Percent complete, data_type: decimal, semantic_type: percent, columns: [percent_complete]}
      - {key: overall_kpi, label: Reported status, data_type: text, columns: [overall_kpi]}
      - {key: schedule_kpi, label: Schedule KPI, data_type: text, columns: [schedule_kpi]}
      - {key: cost_kpi, label: Cost KPI, data_type: text, columns: [cost_kpi]}
      - {key: issue_kpi, label: Issues KPI, data_type: text, columns: [issue_kpi]}
      - {key: planned_deployment_date, label: Planned deployment date, data_type: date, required: true, columns: [planned_deployment_date, tpgmea_planneddeploymentdate, tpgmea_productdeploydate]}
      - {key: first_baselined_deployment_date, label: First baselined deployment date, data_type: date, columns: [first_baselined_deployment_date, tpgmea_firstbaselineddate, tpgmea_firstbaselinedpdd]}
      - {key: actual_deployment_date, label: Actual deployment date, data_type: date, columns: [actual_deployment_date, tpgmea_actualdeploymentdate]}
      - {key: actual_project_start_date, label: Actual start date, data_type: date, columns: [actual_project_start_date]}
      - {key: on_hold_date, label: On hold since, data_type: date, columns: [on_hold_date, tpgmea_projectputonholddate]}
      - {key: on_hold_reason, label: Hold reason, data_type: text, columns: [on_hold_reason, tpgmea_projectputonholdreason]}
      - {key: budget_code, label: Budget code, data_type: text, columns: [budget_code, tpgmea_budgetcode]}
      - {key: budget_type, label: Budget type, data_type: text, values: [CAPEX, OPEX], columns: [budget_type, tpgmea_budgettype]}
      - {key: approved_budget_value_usd, label: Approved budget (USD), data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, columns: [approved_budget_value_usd, tpgmea_approvedbudgetvaluesusd]}
      - {key: cost_total_usd, label: "Forecast cost (EAC, USD)", data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, description: "Forecast at completion (EAC). Not actual spend.", columns: [cost_total_usd, tpgmea_costtotal_usd, tpgmea_customcosttotalusd]}
      - {key: cost_internal_usd, label: "Forecast cost: internal (USD)", data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, columns: [cost_internal_usd, tpgmea_costinternalusd]}
      - {key: cost_external_usd, label: "Forecast cost: external (USD)", data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, columns: [cost_external_usd, tpgmea_costexternalusd]}
      - {key: cost_contingency_usd, label: "Forecast cost: contingency (USD)", data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, columns: [cost_contingency_usd, tpgmea_costcontingencyusd]}
      - {key: cost_hw_usd, label: "Forecast cost: hardware (USD)", data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, columns: [cost_hw_usd, tpgmea_costhwusd]}
      - {key: cost_sw_usd, label: "Forecast cost: software (USD)", data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, columns: [cost_sw_usd, tpgmea_costswusd]}
      - {key: estimated_tcv_usd, label: Estimated TCV (USD), data_type: decimal, semantic_type: currency, sensitivity: confidential, format: {currency: USD}, description: Estimated total contract value., columns: [estimated_tcv_usd, tpgmea_estimatedtcvusd]}
      - {key: approved_pcr_counter, label: Approved change requests, data_type: integer, columns: [approved_pcr_counter, tpgmea_approvedpcrcounter]}
      - {key: project_request_id, label: Originating request, data_type: text, semantic_type: identifier, columns: [project_request_id, tpg_projectrequest]}
      - {key: modified_on, label: Last modified, data_type: datetime, columns: [modified_on, modifiedon]}
      - {key: created_on, label: Created on, data_type: datetime, columns: [created_on, createdon]}
      - {key: planning_stage_end_date, label: Planning stage planned end, data_type: date, columns: [planning_stage_end_date, tpgmea_planningstagedate]}
      - {key: design_stage_end_date, label: Design stage planned end, data_type: date, columns: [design_stage_end_date, tpgmea_designedstagedate]}
      - {key: build_stage_end_date, label: Build stage planned end, data_type: date, columns: [build_stage_end_date, tpgmea_buildenddate]}
      - {key: test_stage_end_date, label: Test stage planned end, data_type: date, columns: [test_stage_end_date, tpgmea_testenddate]}
      - {key: implementation_stage_end_date, label: Implementation stage planned end, data_type: date, columns: [implementation_stage_end_date, tpgmea_implementationenddate]}
      - {key: warranty_stage_end_date, label: Warranty and closure planned end, data_type: date, columns: [warranty_stage_end_date, tpgmea_warrantyandclosurestagedate]}

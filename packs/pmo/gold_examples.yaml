    shape: number
    spec: {measure: {ref: "measure:go_lives_0_30"}}
  - question: Go-lives in 31-60 days by portfolio
    tags: [date_field, breakdown]
    shape: breakdown
    spec: {measure: {ref: "measure:go_lives_31_60"}, breakdowns: [{ref: "dimension:portfolio"}]}
  - question: How many stale projects are there?
    tags: [date_field, look_alike]
    note: Stale is "not modified for 30 days", not status-report compliance (which the source can't measure).
    shape: number
    spec: {measure: {ref: "measure:stale_projects"}}
  - question: Trend of projects by planned deployment month
    tags: [trend, date_field]
    shape: trend
    spec: {measure: {ref: "measure:total_projects"}, time: {ref: "dimension:planned_deployment_date", grain: month}}
  - question: What is the approved budget for open projects?
    tags: [finance]
    shape: number
    spec: {measure: {ref: "measure:approved_budget_total"}}
  - question: Forecast cost by portfolio
    tags: [finance, look_alike, breakdown]
    note: Forecast cost is EAC, not actual spend.
    shape: breakdown
    spec: {measure: {ref: "measure:forecast_cost_total"}, breakdowns: [{ref: "dimension:portfolio"}]}
  - question: Forecast variance by region
    tags: [finance, breakdown]
    shape: breakdown
    spec: {measure: {ref: "measure:budget_variance"}, breakdowns: [{ref: "dimension:region"}]}
  - question: How many projects are over budget?
    tags: [finance, look_alike]
    shape: number
    spec: {measure: {ref: "measure:over_budget"}}
  - question: Open projects in KSA
    tags: [filter, enum]
    shape: number
    spec: {measure: {ref: "measure:open_projects"}, filters: [{ref: "dimension:region", op: "=", values: [KSA]}]}

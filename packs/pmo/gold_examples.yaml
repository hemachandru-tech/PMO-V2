# PMO gold set — DRAFT for STK-008 review (US-057). Imported as suggestions; an Admin approves each one.
# Each example is a question and the Query Spec a correct answer uses (references to the pack model only).
# Tags group the pass rate: baseline, breakdown, filter, enum, look_alike, synonym, date_field, finance, demand,
# fan_out, top_n, trend. Multi-turn cases wait for conversation fixtures (see task.md, US-057).
# 0.2.0 (US-159): +24 examples from the report catalogue (tag `catalogue`), on the pack 1.3.0 measures and
# dimensions (health, compliance, aging and variance bands, conversion, effort, flow).
# Gold set 2.0 (US-184) fields, all optional: `turns` — the earlier messages of a multi-turn example, in order
# (the first a question, the rest refinements such as "top 3" or "only KSA"); `question` is then the follow-up.
# `held_out: true` — never used as an AG-03 few-shot, so it measures questions the planner hasn't seen. Tags
# `alias` (value-linking set) and `multi_turn` group those cases. Check new examples offline first:
# `uv run pytest tests/test_gold_scoring_unit.py` (oracle agreement and execution accuracy on DuckDB).
# 0.3.0 (US-173): +50 `alias` examples (value linking). The offline harnesses link them with every pack synonym
# approved; on a live connection, approve the pack's value synonyms (Admin → Knowledge) before reading `by_tag.alias`.
# 0.4.0 (US-176): +9 `derived` and `share` examples: two measures side by side, a ratio, difference or percentage of
# them, and a measure's share of the total. A derived figure is compared by op, of and to (its key is the planner's).
# 0.7.0 (US-190): +125 held-out `paraphrase` examples (`paraphrase_of` names the original; 38 tagged `exec102`). Runs
# score them beside the original set, per planner path (`by_set`, `by_path`).
# 0.8.0 (US-220): +278 held-out `noise` examples generated from the originals without filter values (filler,
# grammar, future tense, singular, typo; `noise_of` names the original) plus EXEC-139's own question (`exec139`).
# Never edit them by hand: `uv run python -m tela_api.knowledge.noise` rewrites the block after the marker.
# 0.9.0 (US-202, DEC-24): EXEC-115's question (`exec115`): the states it lists are the open-project rule, so it is
# Open projects with no filter (103 on TPG Dataverse; 431 on TPG MySQL); its 6 noise examples regenerated.
# 0.10.0 (US-250, ENH-028): `shape` on every example — the kind of answer it expects (number, list_of_records,
# breakdown, ranking, trend, comparison, share, distribution, record_detail, definition). It must equal
# `scoring.answer_shape(spec)` (checked offline); runs compare it as well as the rows and report a shape × tag grid.
# +88 held-out `exec186` examples: 44 list questions ("list of …", "which …", "names of …", "show all …"; tag `list`,
# one row per record by the entity's name) and their 44 count twins (tag `count`), so "How many …" stays a number.
version: 0.10.0
status: draft
examples:
  - question: How many open projects are there?
    tags: [baseline]
    shape: number
    spec: {measure: {ref: "measure:open_projects"}}
  - question: How many requests are there?
    tags: [baseline, demand]
    shape: number
    spec: {measure: {ref: "measure:total_requests"}}
  - question: Open projects by region
    tags: [breakdown]
    shape: breakdown
    spec: {measure: {ref: "measure:open_projects"}, breakdowns: [{ref: "dimension:region"}]}
  - question: How many projects are in delivery?
    tags: [look_alike]
    note: In delivery is current state Active only; open also counts Project Created and On Hold.
    shape: number
    spec: {measure: {ref: "measure:in_delivery"}}
  - question: How many active projects do we have?
    tags: [look_alike, synonym]
    note: '"Active projects" is a synonym of open projects (current state Project Created, Active or On Hold), not projects in delivery.'
    shape: number
    spec: {measure: {ref: "measure:open_projects"}}
  - question: How many open projects (current state Project Created, Active or On Hold) are there?
    tags: [baseline, exec115]
    note: The listed states are RULE-026 itself (DEC-24), so the certified measure answers it with no filter.
    shape: number
    spec: {measure: {ref: "measure:open_projects"}}
  - question: How many projects are not yet started?
    tags: [look_alike]
    shape: number
    spec: {measure: {ref: "measure:project_created"}}
  - question: Projects on hold by region
    tags: [breakdown]
    shape: breakdown
    spec: {measure: {ref: "measure:on_hold"}, breakdowns: [{ref: "dimension:region"}]}
  - question: How many projects are overdue?
    tags: [look_alike, synonym, date_field]
    note: Overdue means past the planned deployment date and not deployed, not a Red schedule KPI.
    shape: number
    spec: {measure: {ref: "measure:overdue_go_lives"}}
  - question: How many projects are at schedule risk?
    tags: [look_alike]
    note: Schedule risk is the PM's Red/Amber schedule KPI, distinct from overdue.
    shape: number
    spec: {measure: {ref: "measure:schedule_risk"}}
  - question: Overdue go-lives by region
    tags: [date_field, breakdown]
    shape: breakdown
    spec: {measure: {ref: "measure:overdue_go_lives"}, breakdowns: [{ref: "dimension:region"}]}
  - question: Go-lives in the next 30 days

  - forecast cost
  - eac
  - finance
  - financial
  - budget
  - spend
  - cost
  filters:
  - ref: budget_type
    op: '='
    values:
    - CAPEX
  kpis:
  - approved_budget_total
  - forecast_cost_total
  - net_forecast_variance
  - over_budget
  - forecast_over_budget_15
  widgets:

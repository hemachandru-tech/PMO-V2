version: 0.1.0
status: draft
tones: {}
blueprints:
- id: cio_portfolio
  tab: CIO & Portfolio
  title: CIO and portfolio view
  dashboard: cio_portfolio
  section: Executive
  question: Where do the open projects sit by CIO and portfolio, and what status do their managers give them?
  population: Open projects.
  triggers:
  - cio and portfolio
  - cio portfolio
  - portfolio view
  - by cio and portfolio
  kpis:
  - open_projects
  - in_delivery
  - on_hold
  - status_not_set
  widgets:
  - title: Reported status by portfolio
    measure: open_projects
    breakdowns:
    - portfolio
    - reported_status
    visual: stacked_status
  - title: Open projects by CIO
    measure: open_projects
    breakdowns:
    - cio
    visual: ranked_bar
  table:
    title: Open projects
    measure: open_projects
    columns:
    - tpgmea_pprojectnumber
    - tpg_subject
    - tpgmea_customcio
    - tpg_portfolio
    - tpg_overallkpiname
    - tpg_projectstatusname
    - tpg_lifecyclephase
    - tpgmea_productdeploydate
    - tpgmea_pdeliverymanager
    sort:
      field: tpg_portfolio
      dir: asc
    export_name: Open projects by CIO and portfolio
  footnote: Open projects = Project Created, Active and On Hold. Reported status is the project manager's own; Not set is
    counted apart and never as Green.
- id: lifecycle
  tab: Lifecycle
  title: Project lifecycle
  dashboard: lifecycle
  section: Executive
  question: How many open projects are in each lifecycle phase, and where are they stuck?
  population: Open projects by lifecycle phase.
  triggers:
  - project lifecycle
  - lifecycle
  - phases
  - by phase
  kpis:
  - open_projects
  - in_delivery
  - on_hold
  - overdue_go_lives
  widgets:
  - title: Open projects by lifecycle phase
    measure: open_projects
    breakdowns:
    - lifecycle_phase
    visual: columns
  - title: On hold by lifecycle phase
    measure: on_hold
    breakdowns:
    - lifecycle_phase
    visual: columns
  table:
    title: Open projects by phase
    measure: open_projects
    columns:
    - tpgmea_pprojectnumber
    - tpg_subject
    - tpg_lifecyclephase
    - tpg_projectstatusname
    - tpg_progress
    - tpgmea_productdeploydate
    - tpgmea_pdeliverymanager
    sort:
      field: tpg_lifecyclephase
      dir: asc
    export_name: Projects by lifecycle phase
  footnote: Open projects = Project Created, Active and On Hold, in their lifecycle phase order.
- id: critical_tasks
  tab: Critical tasks
  title: Critical tasks
  dashboard: critical_tasks
  section: Delivery
  question: Which unfinished critical-path tasks are late, on the projects that have a plan?
  population: Tasks of project plans (summary rows left out).
  triggers:
  - critical tasks
  - critical path
  - critical task
  - task plan
  - dependencies
  kpis:
  - projects_with_tasks
  - plan_tasks
  - critical_open_tasks
  - critical_tasks_late
  widgets:
  - title: Late critical tasks by project
    measure: critical_tasks_late
    breakdowns:
    - task_project
    visual: ranked_bar
  - title: Open critical tasks by project
    measure: critical_open_tasks
    breakdowns:
    - task_project
    visual: ranked_bar
  table:
    title: Open critical tasks
    measure: critical_open_tasks
    columns:
    - tpg_project
    - tpg_subject
    - tpg_start
    - tpg_finish
    - tpg_progress
    sort:
      field: tpg_finish
      dir: asc
    export_name: Critical tasks
  footnote: Only projects with a task plan. Open = progress below 100 %; late = finish date before the reporting date. Task
    dependencies are not drawn as a network.
- id: raid_summary
  tab: RAID summary
  title: RAID summary
  dashboard: raid_summary
  section: Delivery
  question: What risks, issues, actions and decisions are open across the projects?
  population: Open risks, issues, action items and decisions of every project.
  triggers:
  - raid
  - raid summary
  - risks and issues
  - risk register
  - issue register
  - open risks
  - action items
  kpis:
  - open_risks
  - high_exposure_risks
  - open_issues
  - overdue_actions
  - open_decisions
  widgets:
  - title: Open risks by category
    measure: open_risks
    breakdowns:
    - risk_category
    visual: ranked_bar
  - title: Open issues by priority
    measure: open_issues
    breakdowns:
    - issue_priority
    visual: columns
  - title: Open risks by CIO
    measure: open_risks
    breakdowns:
    - cio
    visual: ranked_bar
  - title: Overdue action items by project
    measure: overdue_actions
    breakdowns:
    - action_project
    visual: ranked_bar
  table:
    title: Open risks
    measure: open_risks
    columns:
    - tpg_project
    - tpg_title
    - tpg_categoryname
    - tpg_costexposure
    - tpg_duedate
    - tpg_assignedto
    sort:
      field: tpg_costexposure
      dir: desc
    export_name: Open risks
  footnote: Open = not Closed (risks, issues) or not Completed (actions, decisions); a blank state counts as open. High exposure
    = likelihood × consequence 15 or more (draft). Cost exposure is what a risk could cost, not money spent.
- id: cio_regional_demand
  tab: CIO & regional demand
  title: CIO and regional demand
  dashboard: cio_regional_demand
  section: Pipeline
  question: Where does the demand come from, by CIO and region?
  population: Open requests.
  triggers:
  - regional demand
  - cio demand
  - demand by cio
  - demand by region
  - cio and regional
  kpis:
  - open_demand
  - estimated_cost_total
  - requests_no_budget
  widgets:
  - title: Open requests by region
    measure: open_demand
    breakdowns:
    - request_region
    visual: ranked_bar
  - title: Open requests by CIO
    measure: open_demand
    breakdowns:
    - request_cio
    visual: ranked_bar
  - title: Estimated cost by region
    measure: estimated_cost_total
    breakdowns:
    - request_region
    visual: ranked_bar
  footnote: Open requests = New, Active, On Hold and Return to Requester, by the request's own CIO and region (not the project's).
- id: demand_budget_cost
  tab: Budget & cost
  title: Demand budget and cost
  dashboard: demand_budget_cost
  section: Pipeline
  question: How do the requests' estimated costs compare with their approved budgets?
  population: Requests with an estimate or a budget.
  triggers:
  - demand budget
  - request budget
  - demand cost
  - estimated cost
  - budget and cost
  kpis:
  - request_budget_total
  - estimated_cost_total
  - requests_no_budget
  widgets:
  - title: Estimated cost and budget by budget type
    measure: request_budget_total
    extra_measures:
    - estimated_cost_total
    breakdowns:
    - request_budget_type
    visual: paired_bars
  table:
    title: Requests with costs
    measure: total_requests
    columns:
    - tpg_projectrequestsid
    - tpg_title
    - tpgmea_budgettypename
    - tpgmea_approvedbudgetvaluesusd
    - tpg_requeststatename
    sort:
      field: tpgmea_approvedbudgetvaluesusd
      dir: desc
    export_name: Demand budget and cost
  footnote: Estimated cost is the request's own estimate before approval, not money spent.
- id: demand_effort
  tab: Demand effort
  title: Demand effort
  dashboard: demand_effort
  section: Pipeline
  question: How much effort (man-days) does the demand need, and from whom?
  population: Requests with an effort estimate.
  triggers:
  - demand effort
  - effort
  - man days
  - mandays
  kpis:
  - effort_internal_md
  - effort_external_md
  - effort_saba_md
  - requests_no_effort_estimate
  widgets:
  - title: Effort by CIO
    measure: effort_internal_md
    extra_measures:
    - effort_external_md
    breakdowns:
    - request_cio
    visual: paired_bars
  - title: Effort by region
    measure: effort_internal_md
    extra_measures:
    - effort_external_md
    breakdowns:
    - request_region
    visual: paired_bars
  - title: Internal effort by platform
    measure: effort_internal_md
    breakdowns:
    - request_platform
    visual: ranked_bar
  - title: Internal effort by priority
    measure: effort_internal_md
    breakdowns:
    - request_priority
    visual: columns
  table:
    title: Requests and effort
    measure: total_requests
    columns:
    - tpg_projectrequestsid
    - tpg_title
    - tpgmea_customcio
    - tpgmea_baplannedefforts
    - tpgmea_totalinternalmds
    - tpgmea_totalexternalmds
    sort:
      field: tpgmea_totalinternalmds
      dir: desc
    export_name: Demand effort
  footnote: Effort in man-days as estimated on the request; requests without an estimate are counted apart.
- id: demand_conversion
  tab: Demand conversion
  title: Demand conversion
  dashboard: demand_conversion
  section: Pipeline
  question: How many requests become projects, and how fast?
  population: All requests; converted = linked to a project.
  triggers:
  - demand conversion
  - conversion
  - converted
  kpis:
  - total_requests
  - converted_requests
  - conversion_rate
  - avg_days_to_convert
  widgets:
  - title: Conversion rate by quarter raised
    measure: conversion_rate
    time:
      ref: quarter_raised
      grain: quarter
    visual: columns
  - title: Converted requests by region
    measure: converted_requests
    breakdowns:
    - request_region
    visual: ranked_bar
  footnote: Converted = a project links to the request. Days to convert = request raised to project created.
- id: cio_book_at_a_glance
  title: The book at a glance
  tab: The book at a glance
  dashboard: audience_cio
  question: How big is my book, what colours does it report, and how much has already slipped?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - book at a glance
  - my book
  - cio headline
  - cio summary
  - colours by cio
  kpis:
  - open_projects
  - reported_green
  - slipped_projects
  - overdue_go_lives
  - no_first_baseline
  footnote: Open projects (current state Project Created, Active or On Hold). Reported status is the project's own colour;
    Yellow is shown as Amber. Slip = finish date − first-baselined go-live; the finish date is the actual go-live if live,
    otherwise the planned go-live, and the reporting date once the planned go-live has passed with no actual go-live.
- id: cio_the_promise
  title: The promise
  tab: The promise
  dashboard: audience_cio
  question: Which open projects are later than the go-live they first committed to, and by how much?
  population: Open projects (current state Project Created, Active or On Hold). Slip only where a first-baselined go-live
    exists.
  triggers:
  - the promise
  - first baseline
  - slip against baseline
  - slipped projects
  - broken promises
  kpis:
  - slipped_projects
  - slip_days_total
  - no_first_baseline
  - no_first_baseline_with_ib_pcr
  footnote: Slip = finish date − first-baselined go-live; the finish date is the actual go-live if live, otherwise the planned
    go-live, and the reporting date once the planned go-live has passed with no actual go-live. A project without a first-baselined
    go-live has no slip value and is counted apart.
- id: cio_promise_moved
  title: How the promise moved, and who moved it
  tab: Who moved the promise
  dashboard: audience_cio
  question: How much of the slip was agreed through change requests, by whom, and how much just happened?
  population: Slipped open projects.
  triggers:
  - how the promise moved
  - who moved the promise
  - agreed vs silent
  - silent slip
  - agreed slip
  kpis:
  - slip_days_total
  - slipped_with_pcr
  - slipped_no_pcr
  footnote: Slipped with a PCR = at least one PCR whose change type is not Initial Baseline, any approval status. Splitting
    slip days into agreed and silent needs a calculator this pack does not have.
- id: cio_green_really_green
  title: Is Green really green?
  tab: Is Green really green?
  dashboard: audience_cio
  question: Which projects report Green while their own records say otherwise?
  population: Open projects reported Green.
  triggers:
  - is green really green
  - false greens
  - watermelon projects
  - greens to challenge
  - hard warnings
  kpis:
  - reported_green
  - green_hard_warning
  - overdue_go_lives
  - named_blocker_projects
  - overdue_action_projects
  footnote: Hard warning = overdue; a blocker named on a status report in the last 30 days; an overdue action; a late unfinished
    task flagged critical. Slipped with no PCR is shown on its own. The colour is never changed, only challenged.
- id: cio_pressure
  title: Where the pressure concentrates
  tab: Where the pressure is
  dashboard: audience_cio
  question: Which delivery managers carry more trouble than their share of the book?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - where the pressure concentrates
  - pressure
  - share of trouble
  - book vs trouble
  kpis:
  - open_projects
  - trouble_projects
  - overdue_go_lives
  - reported_red_pct
  footnote: Trouble = reported Red, or overdue (Active, planned go-live before the reporting date, no actual go-live). Shares
    are whole-number percentages of all open projects and of all projects in trouble.
- id: cio_reliability
  title: How much of this can I rely on?
  tab: Can I rely on it?
  dashboard: audience_cio
  question: How much of what my book shows is backed by evidence and filled-in data?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - how much can i rely on
  - evidence coverage
  - can i trust this
  - data trust
  kpis:
  - status_not_set
  - no_first_baseline
  - no_report_60d
  - missing_stage_date
  - no_delivery_manager
  footnote: Read from the fields the figures depend on; the nine evidence checks need a calculator this pack does not have.
    A gap (no reported status, no first baseline, no report in 60 days, a missing stage date, no delivery manager) means the
    figure that depends on it cannot be fully relied on.
- id: cio_three_calls
  title: Three projects to call about
  tab: Three calls
  dashboard: audience_cio
  question: Which three projects should I call about this week?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - three projects to call about
  - who should i call
  - top 3 worst projects
  - call list
  kpis:
  - trouble_projects
  footnote: Trouble = reported Red, or overdue (Active, planned go-live before the reporting date, no actual go-live). The
    severity score needs a calculator this pack does not have, so the list ranks projects in trouble.
- id: pmo_attention_list
  title: This week's attention list
  tab: Attention list
  dashboard: audience_pmo
  question: Which open projects need the PMO this week, worst first?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - attention list
  - this week's attention list
  - watch list
  - severity list
  - projects needing attention
  kpis:
  - trouble_projects
  - overdue_go_lives
  - slipped_no_pcr
  - named_blocker_projects
  - no_report_60d
  footnote: Trouble = reported Red, or overdue (Active, planned go-live before the reporting date, no actual go-live). The
    severity score needs a calculator this pack does not have, so the list ranks projects in trouble.
- id: pmo_change_control
  title: Is change control working?
  tab: Change control
  dashboard: audience_pmo
  question: When projects slip, do they raise a change request?
  population: Slipped open projects; PCRs of open projects.
  triggers:
  - is change control working
  - change control
  - pcr discipline
  - slipped without pcr
  kpis:
  - slipped_projects
  - slipped_with_pcr
  - slipped_fully_approved_pcr
  - slipped_no_pcr
  footnote: A PCR beyond the baseline is any change type other than Initial Baseline, whatever its approval status. Slip =
    finish date − first-baselined go-live; the finish date is the actual go-live if live, otherwise the planned go-live, and
    the reporting date once the planned go-live has passed with no actual go-live.
- id: pmo_reporting
  title: Are projects telling us what's happening?
  tab: Reporting
  dashboard: audience_pmo
  question: How recently has each open project filed a status report?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - are projects telling us
  - reporting cadence
  - report age
  - days since last report
  - silent projects
  kpis:
  - no_report_60d
  - status_reports_30d
  - status_reports_7d
  - stale_projects
  footnote: No status report in 60 days = open projects with no report dated in the 60 days up to the reporting date, including
    those that never reported. Not the same as stale (no edit for 30 days).
- id: pmo_raid
  title: Risks, issues and actions
  tab: RAID
  dashboard: audience_pmo
  question: What is open in the risk, issue and action logs of open projects?
  population: Risks, issues and actions of open projects.
  triggers:
  - risks issues and actions
  - raid
  - open raid
  - overdue actions
  kpis:
  - open_risks
  - open_issues
  - open_actions
  - overdue_actions
  - open_actions_no_due_date
  footnote: Open risk/issue = state Active (trimmed). Open action = not Completed or Deferred; blank counts as open. The chain
    risk → issue → action is not recorded, and owners are never on the project team in the extract.
- id: pmo_hygiene
  title: Governance hygiene
  tab: Hygiene
  dashboard: audience_pmo
  question: Which basic fields are missing on open projects?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - governance hygiene
  - hygiene
  - missing fields
  - data gaps on projects
  kpis:
  - no_delivery_manager
  - no_cio
  - no_first_baseline
  - missing_stage_date
  - on_hold
  footnote: Open projects (current state Project Created, Active or On Hold). Missing a stage date = any of the six S2–S7
    planned end dates empty.
- id: pmo_lifecycle
  title: Where projects sit in the lifecycle
  tab: Lifecycle
  dashboard: audience_pmo
  question: In which stage, by plan, are the open projects, and what colour do they report there?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - where projects sit in the lifecycle
  - stage
  - stages
  - portfolio storyboard
  - stage by status
  kpis:
  - open_projects
  - staged_open_projects
  - missing_stage_date
  footnote: Read by the project's lifecycle phase. Stage from planned S2–S7 dates needs a calculator this pack does not have.
- id: pmo_review_pack
  title: The weekly list, ready for the review pack
  tab: Review pack
  dashboard: audience_pmo
  question: Which ten projects go into this week's review pack?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - weekly list
  - review pack
  - top 10 projects
  - weekly review
  kpis:
  - trouble_projects
  footnote: Trouble = reported Red, or overdue (Active, planned go-live before the reporting date, no actual go-live). The
    severity score needs a calculator this pack does not have, so the list ranks projects in trouble.
- id: dm_my_book
  title: My book today
  tab: My book
  dashboard: audience_delivery_manager
  question: Where does each of my open projects stand today?
  population: Open projects of the selected delivery manager.
  triggers:
  - my book today
  - my projects
  - my book
  - my portfolio
  kpis:
  - open_projects
  - overdue_go_lives
  - slipped_projects
  - trouble_projects
  footnote: Filtered to one delivery manager. Dates are counted from the reporting date.
- id: dm_coming_up
  title: Coming up
  tab: Coming up
  dashboard: audience_delivery_manager
  question: Which of my projects go live in the next 30, 60 and 90 days?
  population: Open projects with no actual go-live.
  triggers:
  - coming up
  - next go-lives
  - upcoming go-lives
  - due soon
  kpis:
  - go_lives_0_30
  - go_lives_31_60
  - go_lives_61_90
  - go_lives_next_90
  footnote: 'Planned go-lives only, never stage end dates. Windows: next 30 days, 31–60, 61–90.'
- id: dm_whats_stuck
  title: What's stuck
  tab: What's stuck
  dashboard: audience_delivery_manager
  question: Which of my projects are blocked, behind on actions or late on a critical task?
  population: Open projects (current state Project Created, Active or On Hold).
  triggers:
  - what's stuck
  - stuck projects
  - blocked projects
  - blockers
  kpis:
  - named_blocker_projects
  - overdue_action_projects
  - late_critical_task_projects
  footnote: Stuck = a named blocker on the latest status report, an overdue action, or a late task flagged critical.
- id: dm_owe_pmo
  title: What I owe the PMO
  tab: What I owe
  dashboard: audience_delivery_manager
  question: What do I still owe the PMO on my projects?
  population: Open projects of the selected delivery manager.
  triggers:
  - what i owe the pmo
  - my to do
  - missing updates
  - owe the pmo
  kpis:
  - no_report_60d
  - no_first_baseline
  - open_actions_no_due_date
  footnote: Owed = no status report in 60 days (or none); no first-baselined go-live; an action with no owner or no due date.
- id: dm_team
  title: My team and my work
  tab: My team
  dashboard: audience_delivery_manager
  question: Who is on my projects, and what work is logged?
  population: Timesheet lines of my open projects.
  triggers:
  - my team and my work
  - my team
  - team members
  - who works on my projects
  kpis:
  - hours_logged
  - hours_approved
  - hours_awaiting_approval
  - people_logging
  footnote: Timesheet lines and task assignments mostly point into other projects (2 of 322 lines land on their own project),
    so hours are read per line, not as effort against the plan.
- id: dm_changed
  title: What changed since last week
  tab: What changed
  dashboard: audience_delivery_manager
  question: Which change requests and status reports arrived on my projects this week?
  population: PCRs and status reports of open projects in the 7 days to the reporting date.
  triggers:
  - what changed since last week
  - what changed
  - this week
  - recent changes
  kpis:
  - pcrs_last_7d
  - status_reports_7d
  footnote: Requested date (PCRs) and report date (status reports) from 7 days before the reporting date up to it. There is
    no history of field changes, so edits to a project itself are not listed.
- id: req_pipeline
  title: The pipeline
  tab: The pipeline
  dashboard: audience_request
  question: Where do requests stand, from New to Approved?
  population: All requests.
  triggers:
  - the pipeline
  - request pipeline
  - requests by state
  - intake pipeline
  kpis:
  - total_requests
  - open_demand
  - approved_for_delivery
  - rejected_or_dropped
  footnote: Open requests = New, Active, On Hold and Return to Requester. The request stage field is empty in the extract,
    so requests are read by state.
- id: req_speed
  title: Speed to approval
  tab: Speed to approval
  dashboard: audience_request
  question: How long does a request take to be approved, become a project and be committed?
  population: Requests that a project names.
  triggers:
  - speed to approval
  - request lead time
  - time to approve
  - darb lead time
  kpis:
  - request_to_darb_median
  - darb_to_project_median
  - project_to_baseline_median
  - converted_requests
  footnote: 'Averages, as a median cannot be computed on Dataverse yet. Request → DARB approval: client request date → DARB
    approval date. DARB → project: → the project’s created date. Project → commitment: → the first-baselined go-live. Only
    the 24 projects that name their request are measured.'
  widgets:
  - title: Average days per leg
    measure: request_to_darb_median
    extra_measures:
    - darb_to_project_median
    - project_to_baseline_median
    visual: columns
- id: req_conversion
  title: Does an approved request become a project?
  tab: Approved to project
  dashboard: audience_request
  question: Do approved requests turn into projects?
  population: Requests in state Approved.
  triggers:
  - does an approved request become a project
  - approved but no project
  - approved requests
  - request to project
  kpis:
  - approved_for_delivery
  - approved_named_by_project
  - approved_no_project
  footnote: Named by a project = some project's request lookup points to the request; each request counts once. The request's
    Project Link may connect some of the rest.
- id: req_shaping_cost
  title: The cost of shaping requests
  tab: Shaping cost
  dashboard: audience_request
  question: How many hours go into requests before they become projects?
  population: Request timesheet lines.
  triggers:
  - cost of shaping requests
  - hours on requests
  - request effort logged
  - shaping cost
  kpis:
  - request_hours
  - requests_with_hours
  footnote: Hours = total hours on request timesheet lines. Assumes every team that shapes requests logs its time there.
- id: req_stuck
  title: Stuck and sent back
  tab: Stuck and sent back
  dashboard: audience_request
  question: Which open requests are oldest, on hold or sent back?
  population: Open requests.
  triggers:
  - stuck and sent back

# 0.10.0 (US-250): `shape` on every example (= scoring.answer_shape(spec)) and 88 held-out exec186 list/count pairs;
# a list is one row per record by its name field (tpg_projectname, tpg_title).
version: 0.10.0
status: draft
examples:
- question: How many open projects are there?
  tags:
  - baseline
  shape: number
  spec:
    measure:
      ref: measure:open_projects
- question: How many requests are there?
  tags:
  - baseline
  - demand
  shape: number
  spec:
    measure:
      ref: measure:total_requests
- question: Open projects by region
  tags:
  - breakdown
  shape: breakdown
  spec:
    measure:
      ref: measure:open_projects
    breakdowns:
    - ref: dimension:region
- question: How many projects are in delivery?
  tags:
  - look_alike
  note: In delivery is current state Active only; open also counts Project Created and On Hold.
  shape: number
  spec:
    measure:
      ref: measure:in_delivery
- question: How many active projects do we have?
  tags:
  - look_alike
  - synonym
  note: '"Active projects" is a synonym of open projects (current state Project Created, Active or On Hold), not projects
    in delivery.'
  shape: number
  spec:
    measure:
      ref: measure:open_projects
- question: How many projects are not yet started?
  tags:
  - look_alike
  shape: number
  spec:
    measure:
      ref: measure:project_created
- question: Projects on hold by region
  tags:
  - breakdown
  shape: breakdown
  spec:
    measure:
      ref: measure:on_hold
    breakdowns:
    - ref: dimension:region
- question: How many projects are overdue?
  tags:
  - look_alike
  - synonym
  - date_field
  note: Overdue means past the planned deployment date and not deployed, not a Red schedule KPI.
  shape: number
  spec:
    measure:
      ref: measure:overdue_go_lives
- question: How many projects are at schedule risk?
  tags:
  - look_alike
  note: Schedule risk is the PM's Red/Amber schedule KPI, distinct from overdue.
  shape: number
  spec:
    measure:
      ref: measure:schedule_risk
- question: Overdue go-lives by region
  tags:
  - date_field
  - breakdown
  shape: breakdown
  spec:
    measure:
      ref: measure:overdue_go_lives
    breakdowns:
    - ref: dimension:region
- question: Go-lives in the next 30 days
  tags:
  - date_field
  shape: number
  spec:
    measure:
      ref: measure:go_lives_0_30
- question: Go-lives in 31-60 days by portfolio
  tags:
  - date_field
  - breakdown
  shape: breakdown
  spec:
    measure:
      ref: measure:go_lives_31_60
    breakdowns:
    - ref: dimension:portfolio
- question: How many stale projects are there?
  tags:
  - date_field
  - look_alike
  note: Stale is "not modified for 30 days", not status-report compliance (which the source can't measure).
  shape: number
  spec:
    measure:
      ref: measure:stale_projects
- question: Trend of projects by planned deployment month
  tags:
  - trend
  - date_field
  shape: trend
  spec:
    measure:
      ref: measure:total_projects
    time:
      ref: dimension:planned_deployment_date
      grain: month
- question: What is the approved budget for open projects?
  tags:
  - finance
  shape: number
  spec:
    measure:

    where: null
  plain_rule: Counts every tpg taskbaseline record.
- key: tpg_timesheet_count
  label: Number of tpg timesheet
  entity: tpg_timesheet
  expression:
    p: null
    agg: count
    field: null
    value: null
    where: null
  plain_rule: Counts every tpg timesheet record.
- key: total_projects
  label: Projects
  entity: tpg_project
  expression:
    agg: count
  plain_rule: Every project record.
- key: open_projects
  label: Open projects
  entity: tpg_project
  expression:
    agg: count
    where:
      op: in
      field: tpg_projectstatusname
      values:
      - Project Created
      - Active
      - On Hold
  plain_rule: Projects whose current state is Project Created, Active or On Hold. Completed and Dropped are closed. The Dataverse
    statecode is not used for this.
- key: inactive_projects
  label: Closed projects
  entity: tpg_project
  expression:
    agg: count
    where:
      op: not_in
      field: tpg_projectstatusname
      values:
      - Project Created
      - Active
      - On Hold
  plain_rule: Projects whose current state is anything other than Project Created, Active or On Hold (Completed, Dropped).
- key: in_delivery
  label: Projects in delivery
  entity: tpg_project
  expression:
    agg: count
    where:
      op: '='
      field: tpg_projectstatusname
      value: Active
  plain_rule: Projects whose current state is Active. Project Created and On Hold are open but not in delivery.
- key: on_hold
  label: Projects on hold
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_projectstatusname
        value: On Hold
  plain_rule: Open projects whose current state is On Hold.
- key: project_created
  label: Projects not yet started
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_projectstatusname
        value: Project Created
  plain_rule: Open projects whose current state is Project Created.
- key: overdue_go_lives
  label: Overdue go-lives
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Active
      - op: <
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 0
      - op: is_null
        field: tpgmea_projectimpdate
  plain_rule: Projects in delivery whose planned deployment date is before the reporting date and that are not yet deployed.
    A planned date equal to the reporting date is not overdue.
- key: schedule_risk
  label: Schedule risk
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: in
        field: tpg_schedulekpiname
        values:
        - Red
        - Yellow
        - Amber
  plain_rule: Open projects whose schedule KPI is Red or Amber (Yellow). A PM signal, distinct from overdue.
- key: rag_contradictions
  label: RAG contradictions
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_projectimpdate
      - any:
        - all:
          - op: '='
            field: tpg_schedulekpiname
            value: Green
          - op: <=
            field: tpgmea_productdeploydate
            value:
              asof_offset_days: -15
        - all:
          - op: '='
            field: tpg_schedulekpiname
            value: Red
          - op: '>='
            field: tpgmea_productdeploydate
            value:
              asof_offset_days: 30
  plain_rule: Open, undeployed projects reported Green at least 15 days after their planned date, or reported Red at least
    30 days before it.
- key: stale_projects
  label: Stale projects
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Active
      - op: <
        field: modifiedon
        value:
          asof_offset_days: -30
  plain_rule: Projects in delivery not modified for more than 30 days. Any edit resets this, so it is not a status-report
    compliance measure.
- key: go_lives_0_30
  label: Go-lives in the next 30 days
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_projectimpdate
      - op: '>='
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 0
      - op: <=
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 30
  plain_rule: Open, undeployed projects planned from the reporting date up to 30 days after it (by planned deployment date).
- key: go_lives_31_60
  label: Go-lives in 31–60 days
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_projectimpdate
      - op: '>'
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 30
      - op: <=
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 60
  plain_rule: Open, undeployed projects planned more than 30 and up to 60 days after the reporting date.
- key: go_lives_61_90
  label: Go-lives in 61–90 days
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_projectimpdate
      - op: '>'
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 60
      - op: <=
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 90
  plain_rule: Open, undeployed projects planned more than 60 and up to 90 days after the reporting date.
- key: over_budget
  label: Over-budget projects
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '>'
        field: tpgmea_approvedbudgetvaluesusd
        value: 0
      - op: '>'
        field: tpg_totalforecast
        other_field: tpgmea_approvedbudgetvaluesusd
  plain_rule: Projects whose Total Forecast is above an approved budget above 0. Forecast cost is the project’s Total Forecast
    (tpg_totalforecast); EAC (Cost - Total) is not in this pack.
- key: approved_budget_total
  label: Approved budget (USD)
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_approvedbudgetvaluesusd
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '>'
        field: tpgmea_approvedbudgetvaluesusd
        value: 0
      - op: '>='
        field: tpg_totalforecast
        value: 0
  plain_rule: Sum of approved budget over open projects with a budget above 0 and a Total Forecast of 0 or more.
- key: forecast_cost_total
  label: Forecast cost (USD)
  entity: tpg_project
  expression:
    agg: sum
    field: tpg_totalforecast
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '>'
        field: tpgmea_approvedbudgetvaluesusd
        value: 0
      - op: '>='
        field: tpg_totalforecast
        value: 0
  plain_rule: Sum of Total Forecast over open projects with a budget above 0 and a forecast of 0 or more. Forecast cost is
    the project’s Total Forecast (tpg_totalforecast); EAC (Cost - Total) is not in this pack.
- key: budget_variance
  label: Forecast variance (USD)
  entity: tpg_project
  expression:
    op: sub
    left:
      agg: sum
      field: tpg_totalforecast
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '>'
          field: tpgmea_approvedbudgetvaluesusd
          value: 0
        - op: '>='
          field: tpg_totalforecast
          value: 0
    right:
      agg: sum
      field: tpgmea_approvedbudgetvaluesusd
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '>'
          field: tpgmea_approvedbudgetvaluesusd
          value: 0
        - op: '>='
          field: tpg_totalforecast
          value: 0
  plain_rule: Total Forecast minus approved budget over the same open projects. Negative means under budget.
- key: budget_variance_pct
  label: Forecast variance (%)
  entity: tpg_project
  expression:
    op: div
    left:
      op: sub
      left:
        agg: sum
        field: tpg_totalforecast
        where:
          all:
          - op: in
            field: tpg_projectstatusname
            values:
            - Project Created
            - Active
            - On Hold
          - op: '>'
            field: tpgmea_approvedbudgetvaluesusd
            value: 0
          - op: '>='
            field: tpg_totalforecast
            value: 0
      right:
        agg: sum
        field: tpgmea_approvedbudgetvaluesusd
        where:
          all:
          - op: in
            field: tpg_projectstatusname
            values:
            - Project Created
            - Active
            - On Hold
          - op: '>'
            field: tpgmea_approvedbudgetvaluesusd
            value: 0
          - op: '>='
            field: tpg_totalforecast
            value: 0
    right:
      agg: sum
      field: tpgmea_approvedbudgetvaluesusd
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '>'
          field: tpgmea_approvedbudgetvaluesusd
          value: 0
        - op: '>='
          field: tpg_totalforecast
          value: 0
    scale: 100
  plain_rule: Forecast variance divided by approved budget, as a percentage (blank when the approved total is 0).
- key: projects_excluded
  label: Projects excluded from finance totals
  entity: tpg_project
  expression:
    op: sub
    left:
      agg: count
      where:
        op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '>'
          field: tpgmea_approvedbudgetvaluesusd
          value: 0
        - op: '>='
          field: tpg_totalforecast
          value: 0
  plain_rule: Open projects without a budget above 0 and a Total Forecast of 0 or more.
- key: open_demand
  label: Open demand requests
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      op: in
      field: tpg_requeststatename
      values:
      - New
      - Active
      - On Hold
      - Return to Requester
  plain_rule: Requests in state New, Active, On Hold or Return to Requester.
- key: overdue_dou
  label: Overdue DOU gates
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
      - op: '='
        field: tpgmea_dourequiredname
        value: 'Yes'
      - op: <
        field: tpgmea_planneddouissuancedate
        value:
          asof_offset_days: 0
      - op: is_null
        field: tpgmea_dousubmissiondate
  plain_rule: Open requests that need a DOU, whose planned DOU date is before the reporting date, with no DOU issued.
- key: overdue_darb
  label: Overdue DARB gates
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
      - op: '='
        field: tpgmea_darbexempted
        value: false
      - op: <
        field: tpgmea_darbreviewdate
        value:
          asof_offset_days: 0
      - op: is_null
        field: tpgmea_darbapprovaltimestamp
  plain_rule: Open, non-exempt requests whose DARB review date is before the reporting date and that are not yet approved.
- key: overdue_sow
  label: Overdue SOW gates
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
      - op: <
        field: tpgmea_tentativedateofsowissuance
        value:
          asof_offset_days: 0
      - op: is_null
        field: tpgmea_sowissueddate
  plain_rule: Open requests whose planned SOW date is before the reporting date with no SOW issued.
- key: total_requests
  label: Requests
  entity: tpg_projectrequests
  expression:
    agg: count
  plain_rule: Every demand request.
- key: reported_green_pct
  label: Reported Green (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '='
          field: tpg_overallkpiname
          value: Green
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: in
          field: tpg_overallkpiname
          values:
          - Green
          - Yellow
          - Amber
          - Red
    scale: 100
  plain_rule: Open projects reported Green, as a share of open projects with a reported status. Not set is left out of the
    denominator.
- key: reported_amber_pct
  label: Reported Amber (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: in
          field: tpg_overallkpiname
          values:
          - Yellow
          - Amber
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: in
          field: tpg_overallkpiname
          values:
          - Green
          - Yellow
          - Amber
          - Red
    scale: 100
  plain_rule: Open projects reported Amber (Yellow), as a share of open projects with a reported status.
- key: reported_red_pct
  label: Reported Red (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '='
          field: tpg_overallkpiname
          value: Red
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: in
          field: tpg_overallkpiname
          values:
          - Green
          - Yellow
          - Amber
          - Red
    scale: 100
  plain_rule: Open projects reported Red, as a share of open projects with a reported status.
- key: status_not_set
  label: Reported status not set
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: is_null
          field: tpg_overallkpiname
        - op: not_in
          field: tpg_overallkpiname
          values:
          - Green
          - Yellow
          - Amber
          - Red
  plain_rule: Open projects with no reported status. Shown as Not set, never as Green.
- key: avg_health_score
  label: Calculated Green (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '='
          field: tpg_schedulekpiname
          value: Green
        - op: '='
          field: tpg_costkpiname
          value: Green
        - op: '='
          field: tpg_issuekpiname
          value: Green
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: not_null
          field: tpg_schedulekpiname
        - op: not_null
          field: tpg_costkpiname
        - op: not_null
          field: tpg_issuekpiname
    scale: 100
  plain_rule: Calculated Green as a share of open projects whose schedule, cost and issues KPIs are all set. Replaces the
    0–100 score, which needs a calculator this pack does not have.
- key: health_green
  label: Calculated Green
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_schedulekpiname
        value: Green
      - op: '='
        field: tpg_costkpiname
        value: Green
      - op: '='
        field: tpg_issuekpiname
        value: Green
  plain_rule: Open projects whose schedule, cost and issues KPIs are all Green.
- key: health_amber
  label: Calculated Amber
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: not_null
        field: tpg_schedulekpiname
      - op: not_null
        field: tpg_costkpiname
      - op: not_null
        field: tpg_issuekpiname
      - op: '!='
        field: tpg_schedulekpiname
        value: Red
      - op: '!='
        field: tpg_costkpiname
        value: Red
      - op: '!='
        field: tpg_issuekpiname
        value: Red
      - any:
        - op: '='
          field: tpg_schedulekpiname
          value: Yellow
        - op: '='
          field: tpg_costkpiname
          value: Yellow
        - op: '='
          field: tpg_issuekpiname
          value: Yellow
  plain_rule: Open projects with all three KPIs set, none Red and at least one Amber (Yellow).
- key: health_red
  label: Calculated Red
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: '='
          field: tpg_schedulekpiname
          value: Red
        - op: '='
          field: tpg_costkpiname
          value: Red
        - op: '='
          field: tpg_issuekpiname
          value: Red
  plain_rule: Open projects whose schedule, cost or issues KPI is Red.
- key: health_insufficient
  label: Insufficient data
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: is_null
          field: tpg_schedulekpiname
        - op: is_null
          field: tpg_costkpiname
        - op: is_null
          field: tpg_issuekpiname
      - op: '!='
        field: tpg_schedulekpiname
        value: Red
      - op: '!='
        field: tpg_costkpiname
        value: Red
      - op: '!='
        field: tpg_issuekpiname
        value: Red
  plain_rule: Open projects with a blank schedule, cost or issues KPI and none Red. Never counted as Green.
- key: key_priorities_attention
  label: Key priorities needing attention
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpgmea_keypriorityproject
        value: true
      - any:
        - op: in
          field: tpg_schedulekpiname
          values:
          - Red
          - Yellow
        - op: in
          field: tpg_costkpiname
          values:
          - Red
          - Yellow
        - op: in
          field: tpg_issuekpiname
          values:
          - Red
          - Yellow
  plain_rule: Open key priority projects whose schedule, cost or issues KPI is Red or Amber (Yellow).
- key: slip_vs_baseline_median
  label: Average slip vs first baseline (days)
  entity: tpg_project
  expression:
    agg: avg
    value:
      days_to: tpgmea_productdeploydate
      days_from: tpgmea_firstbaselinedpdd
    where:
      op: in
      field: tpg_projectstatusname
      values:
      - Project Created
      - Active
      - On Hold
  plain_rule: Average of planned deployment date minus first baselined date, over open projects with both dates. Positive
    means later than first planned. (A median cannot be computed on Dataverse yet.)
- key: slip_vs_baseline_avg
  label: Average slip vs first baseline (days)
  entity: tpg_project
  expression:
    agg: avg
    value:
      days_to: tpgmea_productdeploydate
      days_from: tpgmea_firstbaselinedpdd
    where:
      op: in
      field: tpg_projectstatusname
      values:
      - Project Created
      - Active
      - On Hold
  plain_rule: Average of planned deployment date minus first baselined date, over open projects with both dates.
- key: slip_vs_baseline_p85
  label: Largest slip vs first baseline (days)
  entity: tpg_project
  expression:
    agg: max
    value:
      days_to: tpgmea_productdeploydate
      days_from: tpgmea_firstbaselinedpdd
    where:
      op: in
      field: tpg_projectstatusname
      values:
      - Project Created
      - Active
      - On Hold
  plain_rule: The largest slip (planned minus first baselined date) among open projects with both dates. (A percentile cannot
    be computed on Dataverse yet.)
- key: overdue_over_90
  label: Overdue more than 90 days
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Active
      - op: <
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: -90
      - op: is_null
        field: tpgmea_projectimpdate
  plain_rule: Overdue go-lives (in delivery, planned date before the reporting date, not deployed) more than 90 days past
    the planned date.
- key: most_overdue_days
  label: Most overdue (days)
  entity: tpg_project
  expression:
    agg: max
    value:
      days_to:
        asof_offset_days: 0
      days_from: tpgmea_productdeploydate
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Active
      - op: <
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 0
      - op: is_null
        field: tpgmea_projectimpdate
  plain_rule: The largest number of days an overdue go-live is past its planned date, at the reporting date.
- key: deployed_projects
  label: Deployed projects
  entity: tpg_project
  expression:
    agg: count
    where:
      op: not_null
      field: tpgmea_projectimpdate
  plain_rule: Projects with an actual deployment date.
- key: deployed_on_time
  label: Deployed on time
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: not_null
        field: tpgmea_projectimpdate
      - op: <=
        field: tpgmea_projectimpdate
        other_field: tpgmea_productdeploydate
  plain_rule: Deployed projects whose actual deployment date is on or before the planned deployment date.
- key: median_schedule_variance
  label: Average schedule variance (days)
  entity: tpg_project
  expression:
    agg: avg
    value:
      days_to: tpgmea_projectimpdate
      days_from: tpgmea_productdeploydate
  plain_rule: Average of actual minus planned deployment date over deployed projects. Positive means late. (A median cannot
    be computed on Dataverse yet.)
- key: deployed_over_60_late
  label: Deployed more than 60 days late
  entity: tpg_project
  expression:
    agg: count
    where:
      of:
        days_to: tpgmea_projectimpdate
        days_from: tpgmea_productdeploydate
      op: '>'
      value: 60
  plain_rule: Deployed projects whose actual deployment date is more than 60 days after the planned date.
- key: on_hold_over_90
  label: On hold more than 90 days
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '='
          field: tpg_projectstatusname
          value: On Hold
      - op: <
        field: tpgmea_projectputonholddate
        value:
          asof_offset_days: -90
  plain_rule: Open projects on hold whose hold started more than 90 days before the reporting date (candidates to restart
    or drop).
- key: longest_on_hold_days
  label: Longest on hold (days)
  entity: tpg_project
  expression:
    agg: max
    value:
      days_to:
        asof_offset_days: 0
      days_from: tpgmea_projectputonholddate
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_projectstatusname
        value: On Hold
  plain_rule: Days from the hold date to the reporting date of the project on hold longest.
- key: avg_on_hold_days
  label: Average time on hold (days)
  entity: tpg_project
  expression:
    agg: avg
    value:
      days_to:
        asof_offset_days: 0
      days_from: tpgmea_projectputonholddate
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_projectstatusname
        value: On Hold
  plain_rule: Average days from the hold date to the reporting date over projects on hold with a hold date.
- key: baselining_in_scope
  label: Past planning
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: not_null
        field: tpg_lifecyclephase
      - op: not_in
        field: tpg_lifecyclephase
        values:
        - Assign PM
        - TRB Review
        - Initiation
        - Planning
  plain_rule: Open projects whose lifecycle phase is past Planning (not Assign PM, TRB Review, Initiation or Planning, and
    set).
- key: baselined
  label: Baselined
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: not_null
          field: tpg_lifecyclephase
        - op: not_in
          field: tpg_lifecyclephase
          values:
          - Assign PM
          - TRB Review
          - Initiation
          - Planning
      - op: not_null
        field: tpgmea_firstbaselinedpdd
  plain_rule: Projects past Planning that have a first baselined deployment date.
- key: baselining_compliance_pct
  label: Baselining compliance (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - all:
          - op: in
            field: tpg_projectstatusname
            values:
            - Project Created
            - Active
            - On Hold
          - op: not_null
            field: tpg_lifecyclephase
          - op: not_in
            field: tpg_lifecyclephase
            values:
            - Assign PM
            - TRB Review
            - Initiation
            - Planning
        - op: not_null
          field: tpgmea_firstbaselinedpdd
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: not_null
          field: tpg_lifecyclephase
        - op: not_in
          field: tpg_lifecyclephase
          values:
          - Assign PM
          - TRB Review
          - Initiation
          - Planning
    scale: 100
  plain_rule: Baselined projects as a share of open projects past Planning.
- key: budget_code_set
  label: With a budget code
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: not_null
        field: tpgmea_budgetcode
      - op: '!='
        field: tpgmea_budgetcode
        value: ''
  plain_rule: Projects in any state that carry a budget code (blank text counts as missing).
- key: budget_code_compliance_pct
  label: Budget code compliance (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: not_null
          field: tpgmea_budgetcode
        - op: '!='
          field: tpgmea_budgetcode
          value: ''
    right:
      agg: count
    scale: 100
  plain_rule: Projects with a budget code as a share of all projects.
- key: pm_assigned
  label: PM assigned
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Active
      - op: not_null
        field: tpgmea_pdeliverymanager
  plain_rule: Projects in delivery with a delivery manager.
- key: pm_assignment_compliance_pct
  label: PM assignment compliance (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: '='
          field: tpg_projectstatusname
          value: Active
        - op: not_null
          field: tpgmea_pdeliverymanager
    right:
      agg: count
      where:
        op: '='
        field: tpg_projectstatusname
        value: Active
    scale: 100
  plain_rule: Projects in delivery with a delivery manager as a share of projects in delivery.
- key: forecast_over_budget_15
  label: Forecast more than 15 % over budget
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '>'
        field: tpgmea_approvedbudgetvaluesusd
        value: 0
      - of:
          calc: div
          left: tpg_totalforecast
          right: tpgmea_approvedbudgetvaluesusd
        op: '>'
        value: 1.15
  plain_rule: Projects whose Total Forecast is more than 15 % above an approved budget above 0. Forecast cost is the project’s
    Total Forecast (tpg_totalforecast); EAC (Cost - Total) is not in this pack.
- key: net_forecast_variance
  label: Net forecast vs budget (USD)
  entity: tpg_project
  expression:
    agg: sum
    value:
      calc: sub
      left: tpg_totalforecast
      right: tpgmea_approvedbudgetvaluesusd
    where:
      all:
      - op: '>'
        field: tpgmea_approvedbudgetvaluesusd
        value: 0
      - op: not_null
        field: tpg_totalforecast
  plain_rule: Sum of Total Forecast minus approved budget over projects in any state with a budget above 0 and a forecast.
    Positive means forecast above budget.
- key: cost_internal_total
  label: 'Forecast cost: internal (USD)'
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_costinternalusd
  plain_rule: Sum of the internal component of forecast cost (EAC).
- key: cost_external_total
  label: 'Forecast cost: external (USD)'
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_costexternalusd
  plain_rule: Sum of the external component of forecast cost (EAC).
- key: cost_contingency_total
  label: 'Forecast cost: contingency (USD)'
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_costcontingencyusd
  plain_rule: Sum of the contingency component of forecast cost (EAC).
- key: cost_hw_total
  label: 'Forecast cost: hardware (USD)'
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_costhwusd
  plain_rule: Sum of the hardware component of forecast cost (EAC).
- key: cost_sw_total
  label: 'Forecast cost: software (USD)'
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_costswusd
  plain_rule: Sum of the software component of forecast cost (EAC).
- key: north_star_on_time_tcv_pct
  label: TCV delivered on time (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: sum
      field: tpgmea_estimatedtcvusd
      where:
        all:
        - all:
          - op: '>'
            field: tpgmea_projectimpdate
            value:
              asof_offset_days: -365
          - op: <=
            field: tpgmea_projectimpdate
            value:
              asof_offset_days: 0
          - op: not_null
            field: tpgmea_firstbaselinedpdd
        - of:
            days_to: tpgmea_projectimpdate
            days_from: tpgmea_firstbaselinedpdd
          op: <=
          value: 30
    right:
      agg: sum
      field: tpgmea_estimatedtcvusd
      where:
        all:
        - op: '>'
          field: tpgmea_projectimpdate
          value:
            asof_offset_days: -365
        - op: <=
          field: tpgmea_projectimpdate
          value:
            asof_offset_days: 0
        - op: not_null
          field: tpgmea_firstbaselinedpdd
    scale: 100
  plain_rule: Estimated TCV of projects deployed in the 12 months to the reporting date within 30 days of their first baseline,
    as a share of the TCV of all projects deployed in those 12 months with a baseline.
- key: lead_time_median
  label: Lead time, average (days)
  entity: tpg_project
  expression:
    agg: avg
    value:
      days_to: tpgmea_projectimpdate
      days_from: tpg_projectrequests.createdon
  plain_rule: Average days from the originating request being raised to the project’s actual deployment, over deployed projects
    with a request. (A median cannot be computed on Dataverse yet.)
- key: lead_time_p85
  label: Lead time, longest (days)
  entity: tpg_project
  expression:
    agg: max
    value:
      days_to: tpgmea_projectimpdate
      days_from: tpg_projectrequests.createdon
  plain_rule: The longest lead time (request raised to deployment) among deployed projects with a request. (A percentile cannot
    be computed on Dataverse yet.)
- key: throughput_go_lives_month
  label: Go-lives per month
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: '>'
          field: tpgmea_projectimpdate
          value:
            asof_offset_days: -365
        - op: <=
          field: tpgmea_projectimpdate
          value:
            asof_offset_days: 0
    right: 12
  plain_rule: Projects deployed in the 12 months to the reporting date, divided by 12.
- key: project_starts_month
  label: Project starts per month
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: '>'
          field: tpgmea_projectactualstartdate
          value:
            asof_offset_days: -365
        - op: <=
          field: tpgmea_projectactualstartdate
          value:
            asof_offset_days: 0
    right: 12
  plain_rule: Projects with an actual start date in the 12 months to the reporting date, divided by 12.
- key: months_to_clear_wip
  label: Months to clear WIP
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
    right:
      agg: count
      where:
        all:
        - op: '>'
          field: tpgmea_projectimpdate
          value:
            asof_offset_days: -365
        - op: <=
          field: tpgmea_projectimpdate
          value:
            asof_offset_days: 0
    scale: 12
  plain_rule: Open projects divided by the monthly go-lives of the last 12 months (blank when nothing went live).
- key: overdue_gates_total
  label: Overdue governance actions
  entity: tpg_projectrequests
  expression:
    op: add
    left:
      op: add
      left:
        agg: count
        where:
          all:
          - op: in
            field: tpg_requeststatename
            values:
            - New
            - Active
            - On Hold
            - Return to Requester
          - op: '='
            field: tpgmea_dourequiredname
            value: 'Yes'
          - op: <
            field: tpgmea_planneddouissuancedate
            value:
              asof_offset_days: 0
          - op: is_null
            field: tpgmea_dousubmissiondate
      right:
        agg: count
        where:
          all:
          - op: in
            field: tpg_requeststatename
            values:
            - New
            - Active
            - On Hold
            - Return to Requester
          - op: '='
            field: tpgmea_darbexempted
            value: false
          - op: <
            field: tpgmea_darbreviewdate
            value:
              asof_offset_days: 0
          - op: is_null
            field: tpgmea_darbapprovaltimestamp
    right:
      agg: count
      where:
        all:
        - op: in
          field: tpg_requeststatename
          values:
          - New
          - Active
          - On Hold
          - Return to Requester
        - op: <
          field: tpgmea_tentativedateofsowissuance
          value:
            asof_offset_days: 0
        - op: is_null
          field: tpgmea_sowissueddate
  plain_rule: Overdue DOU, DARB and SOW gates on open requests, added up.
- key: requests_on_hold_over_180
  label: Requests on hold more than 180 days
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_requeststatename
        value: On Hold
      - op: <
        field: tpgmea_onholddate
        value:
          asof_offset_days: -180
  plain_rule: Requests on hold whose hold started more than 180 days before the reporting date.
- key: request_longest_on_hold_days
  label: Longest request hold (days)
  entity: tpg_projectrequests
  expression:
    agg: max
    value:
      days_to:
        asof_offset_days: 0
      days_from: tpgmea_onholddate
    where:
      op: '='
      field: tpg_requeststatename
      value: On Hold
  plain_rule: Days from the hold date to the reporting date of the request on hold longest.
- key: oldest_open_request_days
  label: Oldest open request (days)
  entity: tpg_projectrequests
  expression:
    agg: max
    value:
      days_to:
        asof_offset_days: 0
      days_from: createdon
    where:
      op: in
      field: tpg_requeststatename
      values:
      - New
      - Active
      - On Hold
      - Return to Requester
  plain_rule: Days from the oldest open request being raised to the reporting date.
- key: estimated_cost_total
  label: Estimated cost (USD)
  entity: tpg_projectrequests
  expression:
    op: add
    left:
      op: add
      left:
        op: add
        left:
          op: add
          left:
            agg: sum
            field: tpgmea_costinternalusd
          right:
            agg: sum
            field: tpgmea_costexternalusd
        right:
          agg: sum
          field: tpgmea_costcontingencyusd
      right:
        agg: sum
        field: tpgmea_costhwusd
    right:
      agg: sum
      field: tpgmea_costswusd
  plain_rule: Sum of the internal, external, contingency, hardware and software cost recorded on requests. An estimate, not
    actual spend.
- key: request_budget_total
  label: Request approved budget (USD)
  entity: tpg_projectrequests
  expression:
    agg: sum
    field: tpgmea_approvedbudgetvaluesusd
  plain_rule: Sum of the approved budget recorded on requests.
- key: requests_no_budget
  label: Requests with no budget yet
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      any:
      - op: is_null
        field: tpgmea_approvedbudgetvaluesusd
      - op: <=
        field: tpgmea_approvedbudgetvaluesusd
        value: 0
  plain_rule: Requests whose approved budget is blank or 0.
- key: approved_for_delivery
  label: Approved for delivery
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      op: '='
      field: tpg_requeststatename
      value: Approved
  plain_rule: Requests in state Approved.
- key: rejected_or_dropped
  label: Rejected or dropped
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      op: in
      field: tpg_requeststatename
      values:
      - Rejected
      - Dropped
  plain_rule: Requests in state Rejected or Dropped.
- key: converted_requests
  label: Converted requests
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectrequest
    where:
      op: not_null
      field: tpg_projectrequest
  plain_rule: Distinct requests that at least one project names as its originating request (read from the project’s request
    lookup).
- key: conversion_rate
  label: Conversion rate (%)
  entity: tpg_projectrequests
  expression:
    op: div
    left:
      agg: count_distinct
      field: tpg_projectrequestsid
      where:
        op: not_null
        field: tpg_project.tpg_projectid
    right:
      agg: count_distinct
      field: tpg_projectrequestsid
    scale: 100
  plain_rule: Converted requests as a share of all requests.
- key: avg_days_to_convert
  label: Average days to convert
  entity: tpg_projectrequests
  expression:
    agg: avg
    value:
      days_to: tpg_project.createdon
      days_from: createdon
    where:
      op: not_null
      field: tpg_project.tpg_projectid
  plain_rule: Average days from a request being raised to its project being created, over converted requests (each project
    counts once).
- key: discovery_completed
  label: Discovery completed
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: not_null
        field: tpgmea_stage1discoveryactualenddate
      - op: not_null
        field: tpgmea_stage1discoveryplannedenddate
  plain_rule: Requests with a discovery actual end date and a planned end date.
- key: discovery_late
  label: Discovery finished late
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - all:
        - op: not_null
          field: tpgmea_stage1discoveryactualenddate
        - op: not_null
          field: tpgmea_stage1discoveryplannedenddate
      - op: '>'
        field: tpgmea_stage1discoveryactualenddate
        other_field: tpgmea_stage1discoveryplannedenddate
  plain_rule: Completed discoveries whose actual end is after the planned end.
- key: discovery_early
  label: Discovery finished early
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - all:
        - op: not_null
          field: tpgmea_stage1discoveryactualenddate
        - op: not_null
          field: tpgmea_stage1discoveryplannedenddate
      - op: <
        field: tpgmea_stage1discoveryactualenddate
        other_field: tpgmea_stage1discoveryplannedenddate
  plain_rule: Completed discoveries whose actual end is before the planned end.
- key: discovery_on_time
  label: Discovery finished on time
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - all:
        - op: not_null
          field: tpgmea_stage1discoveryactualenddate
        - op: not_null
          field: tpgmea_stage1discoveryplannedenddate
      - op: '='
        field: tpgmea_stage1discoveryactualenddate
        other_field: tpgmea_stage1discoveryplannedenddate
  plain_rule: Completed discoveries whose actual end equals the planned end.
- key: effort_internal_md
  label: Internal effort (man-days)
  entity: tpg_projectrequests
  expression:
    agg: sum
    field: tpgmea_totalinternalmds
  plain_rule: Sum of the internal effort estimated on requests, in man-days.
- key: effort_external_md
  label: External effort (man-days)
  entity: tpg_projectrequests
  expression:
    agg: sum
    field: tpgmea_totalexternalmds
  plain_rule: Sum of the external effort estimated on requests, in man-days.
- key: effort_saba_md
  label: SA/BA effort (man-days)
  entity: tpg_projectrequests
  expression:
    agg: sum
    field: tpgmea_baplannedefforts
  plain_rule: Sum of the solution and business analysis effort planned on requests, in man-days.
- key: requests_no_effort_estimate
  label: Requests with no effort estimate
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: is_null
        field: tpgmea_totalinternalmds
      - op: is_null
        field: tpgmea_totalexternalmds
  plain_rule: Requests with neither an internal nor an external effort estimate.
- key: tcv_open_total
  label: Estimated TCV of open projects
  entity: tpg_project
  expression:
    agg: sum
    field: tpgmea_estimatedtcvusd
    where:
      op: in
      field: tpg_projectstatusname
      values:
      - Project Created
      - Active
      - On Hold
  plain_rule: Sum of the estimated total contract value of open projects (blank values are not counted).
- key: staged_open_projects
  label: Open projects with a stage schedule
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: not_null
          field: tpgmea_planningstagedate
        - op: not_null
          field: tpgmea_designedstagedate
        - op: not_null
          field: tpgmea_buildenddate
        - op: not_null
          field: tpgmea_testenddate
        - op: not_null
          field: tpgmea_implementationenddate
        - op: not_null
          field: tpgmea_warrantyandclosurestagedate
  plain_rule: Open projects with at least one stage planned end date.
- key: planning_end_passed
  label: Planning end passed
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: <
        field: tpgmea_planningstagedate
        value:
          asof_offset_days: 0
  plain_rule: Open projects whose planning stage planned end is before the reporting date.
- key: design_end_passed
  label: Design end passed
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: <
        field: tpgmea_designedstagedate
        value:
          asof_offset_days: 0
  plain_rule: Open projects whose design stage planned end is before the reporting date.
- key: build_end_passed
  label: Build end passed
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: <
        field: tpgmea_buildenddate
        value:
          asof_offset_days: 0
  plain_rule: Open projects whose build stage planned end is before the reporting date.
- key: test_end_passed
  label: Test end passed
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: <
        field: tpgmea_testenddate
        value:
          asof_offset_days: 0
  plain_rule: Open projects whose test stage planned end is before the reporting date.
- key: implementation_end_passed
  label: Implementation end passed
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: <
        field: tpgmea_implementationenddate
        value:
          asof_offset_days: 0
  plain_rule: Open projects whose implementation stage planned end is before the reporting date.
- key: warranty_end_passed
  label: Warranty end passed
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: <
        field: tpgmea_warrantyandclosurestagedate
        value:
          asof_offset_days: 0
  plain_rule: Open projects whose warranty and closure stage planned end is before the reporting date.
- key: completed_projects
  label: Completed projects
  entity: tpg_project
  expression:
    agg: count
    where:
      op: '='
      field: tpg_projectstatusname
      value: Completed
  plain_rule: Projects whose current state is Completed.
- key: closure_approved
  label: Closure approved
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Completed
      - op: '='
        field: tpgmea_closeapprovalstatus
        value: Approved
  plain_rule: Completed projects whose closure approval is Approved.
- key: closure_compliance_pct
  label: Closure compliance (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: '='
          field: tpg_projectstatusname
          value: Completed
        - op: '='
          field: tpgmea_closeapprovalstatus
          value: Approved
    right:
      agg: count
      where:
        op: '='
        field: tpg_projectstatusname
        value: Completed
    scale: 100
  plain_rule: Completed projects with closure approved as a share of completed projects.
- key: closure_in_approval
  label: Closure approval in progress
  entity: tpg_project
  expression:
    agg: count
    where:
      op: '='
      field: tpgmea_closeapprovalstatus
      value: Approval In Progress
  plain_rule: Projects in any state whose closure approval is in progress.
- key: closure_overdue
  label: Closure overdue
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Completed
      - any:
        - op: is_null
          field: tpgmea_closeapprovalstatus
        - op: '!='
          field: tpgmea_closeapprovalstatus
          value: Approved
      - op: <
        field: tpgmea_warrantyandclosurestagedate
        value:
          asof_offset_days: 0
  plain_rule: 'DRAFT: completed projects without closure approval whose warranty and closure stage planned end is before the
    reporting date.'
- key: status_reporting_scope
  label: Projects expected to report
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      op: '='
      field: tpg_projectstatusname
      value: Active
  plain_rule: Projects in delivery (current state Active), each counted once.
- key: reported_last_30d
  label: Reported in the last 30 days
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: '='
        field: tpg_projectstatusname
        value: Active
      - op: '>='
        field: tpg_statusreport.tpg_reportdate
        value:
          asof_offset_days: -30
      - op: <=
        field: tpg_statusreport.tpg_reportdate
        value:
          asof_offset_days: 0
  plain_rule: 'DRAFT: projects in delivery with at least one status report dated from 30 days before the reporting date up
    to the reporting date.'
- key: status_reporting_compliance_pct
  label: Status reporting compliance (%)
  entity: tpg_project
  expression:
    op: div
    left:
      agg: count_distinct
      field: tpg_projectid
      where:
        all:
        - op: '='
          field: tpg_projectstatusname
          value: Active
        - op: '>='
          field: tpg_statusreport.tpg_reportdate
          value:
            asof_offset_days: -30
        - op: <=
          field: tpg_statusreport.tpg_reportdate
          value:
            asof_offset_days: 0
    right:
      agg: count_distinct
      field: tpg_projectid
      where:
        op: '='
        field: tpg_projectstatusname
        value: Active
    scale: 100
  plain_rule: Projects in delivery that reported in the last 30 days as a share of projects in delivery.
- key: status_reports_30d
  label: Status reports in the last 30 days
  entity: tpg_statusreport
  expression:
    agg: count
    where:
      all:
      - op: '>='
        field: tpg_reportdate
        value:
          asof_offset_days: -30
      - op: <=
        field: tpg_reportdate
        value:
          asof_offset_days: 0
  plain_rule: Status reports dated from 30 days before the reporting date up to the reporting date.
- key: status_reports_total
  label: Status reports
  entity: tpg_statusreport
  expression:
    agg: count
  plain_rule: Every status report record.
- key: days_since_latest_report
  label: Days since the latest report
  entity: tpg_statusreport
  expression:
    agg: min
    value:
      days_to:
        asof_offset_days: 0
      days_from: tpg_reportdate
    where:
      op: <=
      field: tpg_reportdate
      value:
        asof_offset_days: 0
  plain_rule: Whole days from the most recent status report on or before the reporting date to the reporting date.
- key: total_pcrs
  label: PCRs
  entity: tpg_change
  expression:
    agg: count
  plain_rule: Every project change request (PCR), including initial-baseline PCRs.
- key: pcrs_approved
  label: PCRs fully approved
  entity: tpg_change
  expression:
    agg: count
    where:
      op: '='
      field: tpg_approvalname
      value: Fully Approved
  plain_rule: PCRs whose approval is Fully Approved.
- key: pcrs_pending
  label: PCRs awaiting approval
  entity: tpg_change
  expression:
    agg: count
    where:
      op: in
      field: tpg_approvalname
      values:
      - Not Yet Requested
      - Approval In Progress
      - Requested By (RM) Approved
      - Delivery Manager Approved
  plain_rule: 'PCRs not yet fully approved and not rejected: Not Yet Requested, Approval In Progress, Requested By (RM) Approved,
    Delivery Manager Approved.'
- key: pcrs_rejected
  label: PCRs rejected
  entity: tpg_change
  expression:
    agg: count
    where:
      op: '='
      field: tpg_approvalname
      value: Requested By (RM) Rejected
  plain_rule: PCRs whose approval is Requested By (RM) Rejected.
- key: pcr_approval_pct
  label: PCR approval (%)
  entity: tpg_change
  expression:
    op: div
    left:
      agg: count
      where:
        op: '='
        field: tpg_approvalname
        value: Fully Approved
    right:
      agg: count
    scale: 100
  plain_rule: Fully approved PCRs as a share of all PCRs.
- key: pcrs_golive_change
  label: PCRs changing the go-live
  entity: tpg_change
  expression:
    agg: count
    where:
      op: '='
      field: tpgmea_changeinplannedgolivedate
      value: true
  plain_rule: PCRs that change the planned go-live date.
- key: pcr_additional_cost
  label: Additional cost from PCRs
  entity: tpg_change
  expression:
    agg: sum
    field: tpgmea_additionalcostusd
  plain_rule: Sum of the additional cost recorded on PCRs (an estimate, not money spent).
- key: projects_with_pcr
  label: Projects with a PCR
  entity: tpg_change
  expression:
    agg: count_distinct
    field: tpg_project
  plain_rule: Distinct projects with at least one PCR.
- key: open_risks
  label: Open risks
  entity: tpg_risk
  expression:
    agg: count
    where:
      op: '='
      field: tpg_statename
      value: Active
  plain_rule: Risks whose state is Active (trimmed).
- key: high_exposure_risks
  label: High-exposure risks
  entity: tpg_risk
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_statename
        value: Active
      - any:
        - all:
          - op: '>='
            field: tpg_likelihood
            value: 3
          - op: '>='
            field: tpg_consequence
            value: 5
        - all:
          - op: '>='
            field: tpg_likelihood
            value: 4
          - op: '>='
            field: tpg_consequence
            value: 4
        - all:
          - op: '>='
            field: tpg_likelihood
            value: 5
          - op: '>='
            field: tpg_consequence
            value: 3
  plain_rule: 'DRAFT: open (Active) risks whose likelihood × consequence is 15 or more.'
- key: risk_cost_exposure
  label: Cost exposure of open risks
  entity: tpg_risk
  expression:
    agg: sum
    field: tpg_costexposure
    where:
      op: '='
      field: tpg_statename
      value: Active
  plain_rule: Sum of the cost exposure of open (Active) risks (an estimate of what a risk could cost).
- key: overdue_risks
  label: Risks past their due date
  entity: tpg_risk
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_statename
        value: Active
      - op: <
        field: tpg_duedate
        value:
          asof_offset_days: 0
  plain_rule: Open risks whose due date is before the reporting date.
- key: open_issues
  label: Open issues
  entity: tpg_issue
  expression:
    agg: count
    where:
      op: '='
      field: tpg_statusname
      value: Active
  plain_rule: Issues whose status is not Closed (a blank status counts as open).
- key: high_priority_issues
  label: High-priority open issues
  entity: tpg_issue
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_statusname
        value: Active
      - op: in
        field: tpg_priorityname
        values:
        - High
        - Critical
  plain_rule: Open issues with priority High or Critical.
- key: overdue_issues
  label: Issues past their due date
  entity: tpg_issue
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_statusname
        value: Active
      - op: <
        field: tpg_duedate
        value:
          asof_offset_days: 0
  plain_rule: Open issues whose due date is before the reporting date.
- key: open_actions
  label: Open action items
  entity: tpg_actionitem
  expression:
    agg: count
    where:
      any:
      - op: is_null
        field: tpg_statename
      - op: not_in
        field: tpg_statename
        values:
        - Completed
        - Deferred
  plain_rule: Action items not Completed or Deferred; a blank state counts as open.
- key: overdue_actions
  label: Overdue action items
  entity: tpg_actionitem
  expression:
    agg: count
    where:
      all:
      - any:
        - op: is_null
          field: tpg_statename
        - op: not_in
          field: tpg_statename
          values:
          - Completed
          - Deferred
      - op: <
        field: tpg_duedate
        value:
          asof_offset_days: 0
  plain_rule: Action items not Completed or Deferred (blank counts as open) whose due date is before the reporting date; due
    on the reporting date is not overdue.
- key: open_decisions
  label: Open decisions
  entity: tpg_decision
  expression:
    agg: count
    where:
      any:
      - op: is_null
        field: tpg_statusname
      - op: not_in
        field: tpg_statusname
        values:
        - Completed
  plain_rule: Decisions whose status is not Completed (a blank status counts as open).
- key: hours_logged
  label: Hours logged
  entity: tpg_timesheet
  expression:
    agg: sum
    field: tpg_total
    where:
      op: in
      field: tpg_statusname
      values:
      - Approved
      - Submitted
  plain_rule: Hours on timesheets that are Approved or Submitted (drafts and rejected lines are not counted).
- key: hours_approved
  label: Hours approved
  entity: tpg_timesheet
  expression:
    agg: sum
    field: tpg_total
    where:
      op: '='
      field: tpg_statusname
      value: Approved
  plain_rule: Hours on Approved timesheets.
- key: hours_awaiting_approval
  label: Hours awaiting approval
  entity: tpg_timesheet
  expression:
    agg: sum
    field: tpg_total
    where:
      op: '='
      field: tpg_statusname
      value: Submitted
  plain_rule: Hours on Submitted timesheets.
- key: hours_all
  label: Hours on timesheets
  entity: tpg_timesheet
  expression:
    agg: sum
    field: tpg_total
  plain_rule: Hours on every timesheet line, in any status.
- key: people_logging
  label: People logging time
  entity: tpg_timesheet
  expression:
    agg: count_distinct
    field: tpg_submitter
    where:
      op: in
      field: tpg_statusname
      values:
      - Approved
      - Submitted
  plain_rule: Distinct people with Approved or Submitted hours.
- key: projects_with_time
  label: Projects with time logged
  entity: tpg_timesheet
  expression:
    agg: count_distinct
    field: tpg_project
    where:
      op: in
      field: tpg_statusname
      values:
      - Approved
      - Submitted
  plain_rule: Distinct projects with Approved or Submitted hours.
- key: projects_with_tasks
  label: Projects with a task plan
  entity: tpg_projecttask
  expression:
    agg: count_distinct
    field: tpg_project
  plain_rule: Distinct projects with at least one task.
- key: plan_tasks
  label: Plan tasks
  entity: tpg_projecttask
  expression:
    agg: count
    where:
      any:
      - op: is_null
        field: tpg_issummary
      - op: '!='
        field: tpg_issummary
        value: true
  plain_rule: Tasks that are not summary rows.
- key: critical_open_tasks
  label: Open critical tasks
  entity: tpg_projecttask
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpg_iscritical
        value: true
      - any:
        - op: is_null
          field: tpg_issummary
        - op: '!='
          field: tpg_issummary
          value: true
      - any:
        - op: is_null
          field: tpg_progress
        - op: <
          field: tpg_progress
          value: 100
  plain_rule: Tasks on the critical path, not summary rows, with progress below 100 % (blank progress counts as open).
- key: critical_tasks_late
  label: Late critical tasks
  entity: tpg_projecttask
  expression:
    agg: count
    where:
      all:
      - all:
        - op: '='
          field: tpg_iscritical
          value: true
        - any:
          - op: is_null
            field: tpg_issummary
          - op: '!='
            field: tpg_issummary
            value: true
        - any:
          - op: is_null
            field: tpg_progress
          - op: <
            field: tpg_progress
            value: 100
      - op: <
        field: tpg_finish
        value:
          asof_offset_days: 0
  plain_rule: Open critical tasks whose finish date is before the reporting date; finishing on the reporting date is not late.
- key: open_requests_with_code
  label: Open requests with a budget code
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
      - op: not_null
        field: tpgmea_budgetcode
      - op: '!='
        field: tpgmea_budgetcode
        value: ''
  plain_rule: Open requests (New, Active, On Hold, Return to Requester) that carry a budget code (blank text counts as missing).
- key: request_budget_code_pct
  label: Request budget code compliance (%)
  entity: tpg_projectrequests
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_requeststatename
          values:
          - New
          - Active
          - On Hold
          - Return to Requester
        - op: not_null
          field: tpgmea_budgetcode
        - op: '!='
          field: tpgmea_budgetcode
          value: ''
    right:
      agg: count
      where:
        op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
    scale: 100
  plain_rule: Open requests with a budget code as a share of open requests.
- key: open_requests_with_dm
  label: Open requests with a delivery manager
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
      - op: not_null
        field: tpgmea_deliverymanager
  plain_rule: Open requests with a delivery manager.
- key: request_pm_assignment_pct
  label: Request PM assignment (%)
  entity: tpg_projectrequests
  expression:
    op: div
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_requeststatename
          values:
          - New
          - Active
          - On Hold
          - Return to Requester
        - op: not_null
          field: tpgmea_deliverymanager
    right:
      agg: count
      where:
        op: in
        field: tpg_requeststatename
        values:
        - New
        - Active
        - On Hold
        - Return to Requester
    scale: 100
  plain_rule: Open requests with a delivery manager as a share of open requests.
- key: change_request_count
  label: Change requests
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      op: '='
      field: tpgmea_isthisacrrequest
      value: true
  plain_rule: Requests marked as a change request (CR) to an existing project.
- key: crs_with_master_project
  label: CRs naming their project
  entity: tpg_projectrequests
  expression:
    agg: count
    where:
      all:
      - op: '='
        field: tpgmea_isthisacrrequest
        value: true
      - op: not_null
        field: tpgmea_masterprojectidforcr
  plain_rule: Change requests that name the master project they change.
- key: cr_share_pct
  label: Change request share (%)
  entity: tpg_projectrequests
  expression:
    op: div
    left:
      agg: count
      where:
        op: '='
        field: tpgmea_isthisacrrequest
        value: true
    right:
      agg: count
    scale: 100
  plain_rule: Change requests as a share of all requests.
- key: slipped_projects
  label: Slipped against the first baseline
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: not_null
        field: tpgmea_firstbaselinedpdd
      - any:
        - all:
          - op: not_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_projectimpdate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
        - all:
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_productdeploydate
              days_from:
                asof_offset_days: 0
            op: '>='
            value: 0
          - of:
              days_to: tpgmea_productdeploydate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
        - all:
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_productdeploydate
            op: '>'
            value: 0
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
  plain_rule: 'Open projects with a first-baselined go-live that are later than it: live projects whose actual go-live is
    after it; not-yet-live projects whose planned go-live (still ahead) is after it; and not-yet-live projects whose planned
    go-live has passed and the reporting date is after it.'
- key: slip_days_total
  label: Days slipped
  entity: tpg_project
  expression:
    op: add
    left:
      agg: sum
      value:
        days_to: tpgmea_projectimpdate
        days_from: tpgmea_firstbaselinedpdd
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: not_null
          field: tpgmea_firstbaselinedpdd
        - op: not_null
          field: tpgmea_projectimpdate
        - of:
            days_to: tpgmea_projectimpdate
            days_from: tpgmea_firstbaselinedpdd
          op: '>'
          value: 0
    right:
      op: add
      left:
        agg: sum
        value:
          days_to: tpgmea_productdeploydate
          days_from: tpgmea_firstbaselinedpdd
        where:
          all:
          - op: in
            field: tpg_projectstatusname
            values:
            - Project Created
            - Active
            - On Hold
          - op: not_null
            field: tpgmea_firstbaselinedpdd
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_productdeploydate
              days_from:
                asof_offset_days: 0
            op: '>='
            value: 0
          - of:
              days_to: tpgmea_productdeploydate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
      right:
        agg: sum
        value:
          days_to:
            asof_offset_days: 0
          days_from: tpgmea_firstbaselinedpdd
        where:
          all:
          - op: in
            field: tpg_projectstatusname
            values:
            - Project Created
            - Active
            - On Hold
          - op: not_null
            field: tpgmea_firstbaselinedpdd
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_productdeploydate
            op: '>'
            value: 0
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
  plain_rule: 'Sum of slip days over slipped open projects: actual go-live − first baseline for live projects, planned go-live
    − first baseline while the planned date is ahead, reporting date − first baseline once it has passed.'
- key: slipped_with_pcr
  label: Slipped, with a PCR beyond baseline
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: not_null
        field: tpgmea_firstbaselinedpdd
      - any:
        - all:
          - op: not_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_projectimpdate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
        - all:
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_productdeploydate
              days_from:
                asof_offset_days: 0
            op: '>='
            value: 0
          - of:
              days_to: tpgmea_productdeploydate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
        - all:
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_productdeploydate
            op: '>'
            value: 0
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
      - op: '!='
        field: tpg_change.tpg_changetypename
        value: Initial Baseline
  plain_rule: Slipped open projects (as in Slipped against the first baseline) with at least one PCR whose change type is
    not Initial Baseline, any approval status.
- key: slipped_no_pcr
  label: Slipped, no PCR beyond baseline
  entity: tpg_project
  expression:
    op: sub
    left:
      agg: count
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: not_null
          field: tpgmea_firstbaselinedpdd
        - any:
          - all:
            - op: not_null
              field: tpgmea_projectimpdate
            - of:
                days_to: tpgmea_projectimpdate
                days_from: tpgmea_firstbaselinedpdd
              op: '>'
              value: 0
          - all:
            - op: is_null
              field: tpgmea_projectimpdate
            - of:
                days_to: tpgmea_productdeploydate
                days_from:
                  asof_offset_days: 0
              op: '>='
              value: 0
            - of:
                days_to: tpgmea_productdeploydate
                days_from: tpgmea_firstbaselinedpdd
              op: '>'
              value: 0
          - all:
            - op: is_null
              field: tpgmea_projectimpdate
            - of:
                days_to:
                  asof_offset_days: 0
                days_from: tpgmea_productdeploydate
              op: '>'
              value: 0
            - of:
                days_to:
                  asof_offset_days: 0
                days_from: tpgmea_firstbaselinedpdd
              op: '>'
              value: 0
    right:
      agg: count_distinct
      field: tpg_projectid
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: not_null
          field: tpgmea_firstbaselinedpdd
        - any:
          - all:
            - op: not_null
              field: tpgmea_projectimpdate
            - of:
                days_to: tpgmea_projectimpdate
                days_from: tpgmea_firstbaselinedpdd
              op: '>'
              value: 0
          - all:
            - op: is_null
              field: tpgmea_projectimpdate
            - of:
                days_to: tpgmea_productdeploydate
                days_from:
                  asof_offset_days: 0
              op: '>='
              value: 0
            - of:
                days_to: tpgmea_productdeploydate
                days_from: tpgmea_firstbaselinedpdd
              op: '>'
              value: 0
          - all:
            - op: is_null
              field: tpgmea_projectimpdate
            - of:
                days_to:
                  asof_offset_days: 0
                days_from: tpgmea_productdeploydate
              op: '>'
              value: 0
            - of:
                days_to:
                  asof_offset_days: 0
                days_from: tpgmea_firstbaselinedpdd
              op: '>'
              value: 0
        - op: '!='
          field: tpg_change.tpg_changetypename
          value: Initial Baseline
  plain_rule: 'Slipped open projects minus those with a PCR beyond the Initial Baseline: the slip was never put through change
    control.'
- key: slipped_fully_approved_pcr
  label: Slipped, with a fully approved PCR
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: not_null
        field: tpgmea_firstbaselinedpdd
      - any:
        - all:
          - op: not_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_projectimpdate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
        - all:
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to: tpgmea_productdeploydate
              days_from:
                asof_offset_days: 0
            op: '>='
            value: 0
          - of:
              days_to: tpgmea_productdeploydate
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
        - all:
          - op: is_null
            field: tpgmea_projectimpdate
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_productdeploydate
            op: '>'
            value: 0
          - of:
              days_to:
                asof_offset_days: 0
              days_from: tpgmea_firstbaselinedpdd
            op: '>'
            value: 0
      - op: '!='
        field: tpg_change.tpg_changetypename
        value: Initial Baseline
      - op: '='
        field: tpg_change.tpg_approvalname
        value: Fully Approved
  plain_rule: Slipped open projects with at least one Fully Approved PCR whose change type is not Initial Baseline.
- key: no_first_baseline
  label: No first-baselined go-live
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_firstbaselinedpdd
  plain_rule: Open projects whose first-baselined deployment date is empty.
- key: no_first_baseline_with_ib_pcr
  label: No first baseline, but an Initial Baseline PCR
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_firstbaselinedpdd
      - op: '='
        field: tpg_change.tpg_changetypename
        value: Initial Baseline
  plain_rule: 'Each project counted once: no first-baselined date on the project, at least one PCR of type Initial Baseline.'
- key: reported_green
  label: Reported Green
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_overallkpiname
        value: Green
  plain_rule: Open projects with overall KPI Green.
- key: green_hard_warning
  label: Greens carrying a hard warning
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_overallkpiname
        value: Green
      - any:
        - all:
          - op: '='
            field: tpg_projectstatusname
            value: Active
          - op: is_null
            field: tpgmea_projectimpdate
          - op: <
            field: tpgmea_productdeploydate
            value:
              asof_offset_days: 0
        - all:
          - op: not_null
            field: tpg_statusreport.tpgmea_keyblockers
          - op: '>='
            field: tpg_statusreport.tpg_reportdate
            value:
              asof_offset_days: -30
          - op: <=
            field: tpg_statusreport.tpg_reportdate
            value:
              asof_offset_days: 0
        - all:
          - any:
            - op: is_null
              field: tpg_actionitem.tpg_statename
            - op: not_in
              field: tpg_actionitem.tpg_statename
              values:
              - Completed
              - Deferred
          - op: <
            field: tpg_actionitem.tpg_duedate
            value:
              asof_offset_days: 0
        - all:
          - op: '='
            field: tpg_projecttask.tpg_iscritical
            value: true
          - op: <
            field: tpg_projecttask.tpg_finish
            value:
              asof_offset_days: 0
          - any:
            - op: is_null
              field: tpg_projecttask.tpg_progress
            - op: <
              field: tpg_projecttask.tpg_progress
              value: 100
  plain_rule: Open projects reported Green that are overdue, name a blocker on a status report in the last 30 days, have an
    overdue action, or have a late unfinished task flagged critical. (Slipped with no PCR is shown separately as Slipped,
    no PCR beyond baseline.)
- key: trouble_projects
  label: Projects in trouble
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: '='
          field: tpg_overallkpiname
          value: Red
        - all:
          - op: '='
            field: tpg_projectstatusname
            value: Active
          - op: is_null
            field: tpgmea_projectimpdate
          - op: <
            field: tpgmea_productdeploydate
            value:
              asof_offset_days: 0
  plain_rule: Open projects reported Red, or in delivery past their planned go-live with no actual go-live.
- key: named_blocker_projects
  label: Blocker named in the last 30 days
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: not_null
        field: tpg_statusreport.tpgmea_keyblockers
      - op: '>='
        field: tpg_statusreport.tpg_reportdate
        value:
          asof_offset_days: -30
      - op: <=
        field: tpg_statusreport.tpg_reportdate
        value:
          asof_offset_days: 0
  plain_rule: Open projects with key blockers filled in on a status report dated in the 30 days up to the reporting date.
- key: no_report_60d
  label: No status report in 60 days
  entity: tpg_project
  expression:
    op: sub
    left:
      agg: count
      where:
        op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
    right:
      agg: count_distinct
      field: tpg_projectid
      where:
        all:
        - op: in
          field: tpg_projectstatusname
          values:
          - Project Created
          - Active
          - On Hold
        - op: '>='
          field: tpg_statusreport.tpg_reportdate
          value:
            asof_offset_days: -60
        - op: <=
          field: tpg_statusreport.tpg_reportdate
          value:
            asof_offset_days: 0
  plain_rule: Open projects minus those with a status report dated in the 60 days up to the reporting date (so projects that
    never reported are included). Not the same as Stale projects (no edit for 30 days).
- key: late_critical_task_projects
  label: Projects with a late critical task
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: '='
        field: tpg_projecttask.tpg_iscritical
        value: true
      - op: <
        field: tpg_projecttask.tpg_finish
        value:
          asof_offset_days: 0
      - any:
        - op: is_null
          field: tpg_projecttask.tpg_progress
        - op: <
          field: tpg_projecttask.tpg_progress
          value: 100
  plain_rule: Open projects with a task where is critical = Yes, finish before the reporting date and progress below 100 or
    blank.
- key: overdue_action_projects
  label: Projects with an overdue action
  entity: tpg_project
  expression:
    agg: count_distinct
    field: tpg_projectid
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: is_null
          field: tpg_actionitem.tpg_statename
        - op: not_in
          field: tpg_actionitem.tpg_statename
          values:
          - Completed
          - Deferred
      - op: <
        field: tpg_actionitem.tpg_duedate
        value:
          asof_offset_days: 0
  plain_rule: Open projects with an action not Completed or Deferred whose due date is before the reporting date.
- key: go_lives_next_90
  label: Go-lives in the next 90 days
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_projectimpdate
      - op: '>='
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 0
      - op: <=
        field: tpgmea_productdeploydate
        value:
          asof_offset_days: 90
  plain_rule: Open projects with no actual go-live whose planned go-live is from the reporting date to 90 days after it. Planned
    go-lives only, never stage end dates.
- key: no_delivery_manager
  label: No delivery manager
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_pdeliverymanager
  plain_rule: Open projects whose delivery manager is empty.
- key: no_cio
  label: No CIO
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - op: is_null
        field: tpgmea_customcio
  plain_rule: Open projects whose CIO is empty.
- key: missing_stage_date
  label: Missing a stage date
  entity: tpg_project
  expression:
    agg: count
    where:
      all:
      - op: in
        field: tpg_projectstatusname
        values:
        - Project Created
        - Active
        - On Hold
      - any:
        - op: is_null
          field: tpgmea_planningstagedate
        - op: is_null
          field: tpgmea_designedstagedate
        - op: is_null
          field: tpgmea_buildenddate
        - op: is_null
          field: tpgmea_testenddate
        - op: is_null
          field: tpgmea_implementationenddate
        - op: is_null
          field: tpgmea_warrantyandclosurestagedate
  plain_rule: Open projects where at least one of the S2 Plan … S7 Warranty & Closure planned end dates is empty.
- key: pcrs_beyond_baseline
  label: Change requests beyond the baseline
  entity: tpg_change
  expression:
    agg: count
    where:
      op: '!='
      field: tpg_changetypename
      value: Initial Baseline
  plain_rule: PCRs whose change type is not Initial Baseline, whatever their approval status.
- key: pcrs_last_7d
  label: PCRs raised in the last 7 days
  entity: tpg_change
  expression:
    agg: count
    where:
      all:
      - op: '>='
        field: tpg_requesteddate
        value:
          asof_offset_days: -7
      - op: <=
        field: tpg_requesteddate
        value:
          asof_offset_days: 0
  plain_rule: PCRs whose requested date is in the 7 days up to and including the reporting date.
- key: status_reports_7d
  label: Status reports in the last 7 days
  entity: tpg_statusreport
  expression:
    agg: count
    where:
      all:
      - op: '>='
        field: tpg_reportdate
        value:
          asof_offset_days: -7
      - op: <=
        field: tpg_reportdate
        value:
          asof_offset_days: 0
  plain_rule: Status reports whose report date is in the 7 days up to and including the reporting date.
- key: open_actions_no_due_date
  label: Open actions with no due date
  entity: tpg_actionitem
  expression:
    agg: count
    where:
      all:
      - any:
        - op: is_null
          field: tpg_statename
        - op: not_in
          field: tpg_statename
          values:
          - Completed
          - Deferred
      - op: is_null
        field: tpg_duedate
  plain_rule: Action items not Completed or Deferred with an empty due date.
- key: approved_named_by_project
  label: Approved requests named by a project
  entity: tpg_projectrequests
  expression:
    agg: count_distinct
    field: tpg_projectrequestsid
    where:
      all:
      - op: '='
        field: tpg_requeststatename
        value: Approved
      - op: not_null
        field: tpg_project.tpg_projectid
  plain_rule: Requests in state Approved that some project names in its request lookup; each request once.
- key: approved_no_project
  label: Approved requests with no project
  entity: tpg_projectrequests
  expression:
    agg: count_distinct
    field: tpg_projectrequestsid
    where:
      all:
      - op: '='
        field: tpg_requeststatename
        value: Approved
      - op: is_null
        field: tpg_project.tpg_projectid
  plain_rule: Requests in state Approved that no project names in its request lookup. Some may be linked only through the
    request's Project Link.
- key: request_to_darb_median
  label: Request → DARB approval (average days)
  entity: tpg_projectrequests
  expression:
    agg: avg
    value:
      days_to: tpgmea_darbapprovaltimestamp
      days_from: tpgmea_clientrequestdate
    where:
      op: not_null
      field: tpg_project.tpg_projectid
  plain_rule: Average days from client request date to DARB approval date, over requests a project names. (A median cannot
    be computed on Dataverse yet.)
- key: darb_to_project_median
  label: DARB approval → project created (average days)
  entity: tpg_projectrequests
  expression:
    agg: avg
    value:
      days_to: tpg_project.createdon
      days_from: tpgmea_darbapprovaltimestamp
    where:
      op: not_null
      field: tpg_project.tpg_projectid
  plain_rule: Average days from DARB approval date to the created date of the request’s projects. (A median cannot be computed
    on Dataverse yet.)
- key: project_to_baseline_median
  label: Project created → first baseline (average days)
  entity: tpg_projectrequests
  expression:
    agg: avg
    value:
      days_to: tpg_project.tpgmea_firstbaselinedpdd
      days_from: tpg_project.createdon
    where:
      op: not_null
      field: tpg_project.tpg_projectid
  plain_rule: Average days from the created date of the request’s projects to their first-baselined go-live. (A median cannot
    be computed on Dataverse yet.)
- key: request_hours
  label: Hours on requests
  entity: tpgmea_projectrequesttimesheet
  expression:
    agg: sum
    field: tpg_total
  plain_rule: Sum of total hours on request timesheet lines.
- key: requests_with_hours
  label: Requests with hours logged
  entity: tpgmea_projectrequesttimesheet
  expression:
    agg: count_distinct
    field: tpgmea_prtprojectrequest
  plain_rule: Distinct requests named on request timesheet lines.

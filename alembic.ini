# Alembic configuration for the Tela metadata database (db_scheme §12).
# The database URL is NOT stored here: it is read from TELA_MIGRATE_DATABASE_URL
# or the file named by TELA_MIGRATE_DATABASE_URL_FILE (see migrations/env.py).

[alembic]
script_location = migrations
version_locations = migrations/versions
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

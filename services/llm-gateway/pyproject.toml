[project]
name = "tela-gateway"
version = "0.1.0"
description = "Tela LLM gateway (COMP-006): the only path to model providers"
requires-python = ">=3.12"
dependencies = [
    "tela-common[otel,secrets]",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
    "anthropic>=2.1",
    "openai>=3.37",
    "google-genai>=2.33",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tela_gateway"]

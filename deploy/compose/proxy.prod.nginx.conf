# Edge proxy (production override). TLS ends at the host nginx, which forwards to 127.0.0.1:8088 with the
# original Host header. Edge proxy (COMP-017) for the local / single-host profile. It is the only container
# that publishes a host port. tela.localhost serves the SPA and the API on one origin;
# auth.localhost serves Keycloak. Readiness and metrics endpoints are never exposed.
server_tokens off;
client_max_body_size 55m;  # Excel/CSV uploads up to 50 MB (US-108)

map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 8088;
    server_name telainsight.prodiantela.ai;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://telaauth.prodiantela.ai; frame-src https://telaauth.prodiantela.ai; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://telaauth.prodiantela.ai" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(readyz|metrics) { return 404; }
    location /api/v1/internal/ { return 404; }  # worker → API only, never from the edge (US-095)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;  # server-sent events for chat (API-016)
    }

    location /scim/v2/ {  # Entra provisioning (US-118); the API checks the per-tenant token
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
    }
}

server {
    listen 8088;
    server_name telaauth.prodiantela.ai;

    location /admin/ { return 403; }  # use the Keycloak admin console only from inside the network

    location / {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
}

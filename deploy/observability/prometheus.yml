# Prometheus (US-010). Services expose /metrics on the internal network only; the edge proxy returns 404 for it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tela-api
    metrics_path: /metrics
    static_configs: [{ targets: ["api:8000"], labels: { service: tela-api } }]
  - job_name: tela-llm-gateway
    metrics_path: /metrics
    static_configs: [{ targets: ["llm-gateway:8200"], labels: { service: tela-llm-gateway } }]
  - job_name: tela-connector-runner
    metrics_path: /metrics
    static_configs: [{ targets: ["connector-runner:8100"], labels: { service: tela-connector-runner } }]
